name: AI Agent Plug-ins CI

on:
  pull_request:
    paths:
      - '.github/workflows/ai-plugins-ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.gitignore'
      - 'LICENSE.txt'
      - 'packages/ai-plugins/**'
      - 'packages/agent-skills/**'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/ai-plugins-ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.gitignore'
      - 'LICENSE.txt'
      - 'packages/ai-plugins/**'
      - 'packages/agent-skills/**'

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --workspace @oracle/ai-plugins

      - name: Validate plugin configuration
        run: npm run validate --workspace @oracle/ai-plugins

      - name: Run tests
        run: npm run test --workspace @oracle/ai-plugins

      - name: Run Python visualizer regressions
        run: |
          python3 -I -S -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          python3 -I -S packages/ai-plugins/test/test_suiteskills_visualizer.py

      - name: Build plugin directories
        run: npm run build --workspace @oracle/ai-plugins

      - name: Install pinned Claude validator
        run: bash packages/ai-plugins/scripts/install-claude-validator.sh

      - name: Verify release output matches source build
        run: npm run verify-release --workspace @oracle/ai-plugins
