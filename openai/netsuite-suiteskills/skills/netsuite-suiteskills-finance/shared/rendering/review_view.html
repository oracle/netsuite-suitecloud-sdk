<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@@TITLE@@</title><style>@@TOKENS@@
*{box-sizing:border-box}body{margin:0;background:var(--ns-page,#f5f4f2);color:var(--ns-ink,#312d2a);font:16px/1.5 var(--ns-font,Arial,sans-serif)}main{max-width:1200px;margin:auto;padding:24px}header{background:var(--rw-ocean-150,#173f4f);color:var(--rw-text-dark,#fff);padding:24px;border-radius:8px}h1{margin:0}section{background:var(--ns-card,#fff);padding:20px;margin-top:16px;border-radius:8px}.controls{display:flex;gap:16px;flex-wrap:wrap}label{display:grid;gap:4px}input,select,button{font:inherit;padding:8px;color:inherit;background:var(--ns-card,#fff);border:1px solid var(--ns-line-strong,#aaa);border-radius:4px}button:disabled{opacity:.5}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ns-focus,#087e8b)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--ns-line,#ddd);vertical-align:top}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.note{font-size:14px}nav{display:flex;gap:12px}@media(max-width:600px){main{padding:12px}header,section{padding:16px}.controls>label{width:100%}}
</style></head><body><main><header><h1>@@TITLE@@</h1><p id="scope"></p></header><section><p>@@STATUS@@</p><p class="note">Local mechanical checks do not establish accounting correctness, independent review, freshness or approval. Existing analytical and visualization requirements still apply.</p><div class="controls"><label>Filter retrieved rows<input id="filter" type="search"></label><label>Sort by<select id="sort"></select></label><label>Direction<select id="direction"><option value="ascending">Ascending</option><option value="descending">Descending</option></select></label></div><p id="count" role="status"></p><div class="table-wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div><nav aria-label="Result pages"><button id="previous">Previous</button><button id="next">Next</button></nav></section><section><details><summary>Sources, calculation lineage and review state</summary><pre id="details"></pre></details></section><noscript>Interactive rows require JavaScript. Request the existing text/table output if unavailable.</noscript></main><script type="application/json" id="review-data">@@DATA@@</script><script>@@SCRIPT@@</script></body></html>
