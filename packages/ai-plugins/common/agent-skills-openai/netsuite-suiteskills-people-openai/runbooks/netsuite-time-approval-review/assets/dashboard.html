<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Time Approval Review</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: light-dark(#f5f7f9, #111820);
      --surface: light-dark(#fff, #1a232d);
      --surface-soft: light-dark(#eef2f5, #202c37);
      --text: light-dark(#172331, #e7edf3);
      --muted: light-dark(#657485, #a8b4bf);
      --line: light-dark(#cbd4dd, #394754);
      --brand: light-dark(#2d75a3, #69a3ca);
      --brand-soft: light-dark(#edf5fa, #152734);
      --success: light-dark(#26764c, #79c99a);
      --warning: light-dark(#946518, #e1b35f);
      --warning-soft: light-dark(#fff8eb, #2d2518);
      --danger: light-dark(#9a3e3e, #ef8d8d);
      --focus: light-dark(#136fa2, #8cc9ef);
      --radius: 5px;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--page); }
    body { margin: 0; color: var(--text); background: var(--page); font: 14px/1.45 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, select { font: inherit; }
    button, input[type="search"], select { color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
    button { min-height: 34px; padding: 5px 11px; cursor: pointer; font-weight: 650; }
    button:hover:not(:disabled) { border-color: var(--brand); }
    button:disabled { cursor: not-allowed; opacity: .48; }
    button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 25px; line-height: 1.15; font-weight: 680; letter-spacing: -.015em; }
    h2 { font-size: 16px; line-height: 1.3; }
    [hidden] { display: none !important; }
    .dashboard { width: min(1180px, calc(100% - 20px)); margin: 10px auto; border: 1px solid var(--line); border-radius: 10px; background: var(--page); }
    .product-bar { min-height: 42px; display: flex; align-items: center; gap: 12px; padding: 0 20px; background: light-dark(#243648, #1d2b39); color: #fff; border-bottom: 1px solid light-dark(#172839, #344353); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; border-radius: 9px 9px 0 0; }
    .product-mark { font-weight: 750; letter-spacing: .12em; }
    .product-separator { opacity: .45; }
    .product-section { opacity: .86; }
    .shell { padding: 22px; }
    .page-head, .browse-head, .list-status { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .page-head { align-items: flex-start; margin-bottom: 18px; }
    .scope { margin-top: 5px; color: var(--muted); }
    .head-meta { display: grid; justify-items: end; gap: 4px; color: var(--muted); font-size: 12px; text-align: right; }
    .status-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
    .metric { min-height: 96px; padding: 14px 15px; border: 1px solid var(--line); border-top: 3px solid var(--brand); background: var(--surface); box-shadow: 0 1px 2px rgb(11 28 43 / 4%); }
    .metric.metric-success { border-top-color: var(--success); }
    .metric.metric-danger { border-top-color: var(--danger); }
    .metric.metric-warning { border-top-color: var(--warning); }
    .metric-muted { border-top-color: var(--muted); }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { display: block; margin-top: 7px; font-size: 24px; line-height: 1; font-weight: 690; }
    .metric-note, .subtle, .browse-note, .entry-copy { color: var(--muted); font-size: 12px; }
    .entry-copy { display: block; margin-top: 3px; }
    .metric-note { display: block; margin-top: 7px; font-size: 11px; }
    .weekly-summary, .coverage { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; padding: 13px 15px; border: 1px solid var(--line); margin-bottom: 12px; }
    .weekly-summary { border-color: color-mix(in srgb, var(--finding-color) 45%, var(--line)); background: color-mix(in srgb, var(--finding-color) 10%, transparent); color: var(--finding-color); }
    .weekly-summary[hidden] { display: none; }
    .weekly-icon { display: grid; width: 28px; height: 28px; place-items: center; color: inherit; font-size: 23px; line-height: 1; }
    .weekly-summary p { margin-top: 2px; color: inherit; }
    .coverage { background: var(--brand-soft); margin-bottom: 16px; }
    .coverage-title { font-weight: 680; color: light-dark(#244861, #bcd9eb); }
    .coverage-items { display: flex; flex-wrap: wrap; gap: 8px 15px; }
    .coverage-item::before { margin-right: 5px; font-weight: 800; }
    .coverage-good::before { content: "✓"; color: var(--success); }
    .coverage-partial::before { content: "△"; color: var(--warning); }
    .coverage-off::before { content: "—"; color: var(--muted); }
    .browse { padding: 12px 14px; border: 1px solid var(--line); background: var(--surface); margin-bottom: 10px; }
    .filter-grid { display: grid; grid-template-columns: minmax(210px, 2fr) repeat(3, minmax(145px, 1fr)); gap: 12px; margin-top: 12px; }
    .field { display: grid; gap: 4px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .field input, .field select { width: 100%; min-height: 34px; padding: 5px 9px; }
    .button-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .list-status { padding: 9px 12px; border: 1px solid var(--line); background: var(--surface-soft); margin-bottom: 10px; }
    .filtered-view { font-weight: 680; }
    .owner-list { display: grid; gap: 10px; }
    details > summary { list-style: none; cursor: pointer; }
    details > summary::-webkit-details-marker { display: none; }
    .owner, .review-group { border: 1px solid var(--line); background: var(--surface); }
    .owner-head, .group-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; }
    .owner-head { min-height: 54px; background: var(--surface-soft); }
    .summary-main { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .chevron { color: var(--muted); transition: transform .16s ease; }
    details[open] > summary .chevron { transform: rotate(90deg); }
    .avatar { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-size: 11px; font-weight: 760; flex: 0 0 auto; }
    .name, .group-title, .entry-date, .entry-project { font-weight: 700; }
    .owner-totals { display: grid; justify-items: end; gap: 3px; text-align: right; color: light-dark(#3f5163, #c2ccd5); }
    .totals-line { display: block; }
    .review-summary { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; min-width: 0; max-width: 100%; white-space: normal; overflow-wrap: anywhere; font-size: 12px; }
    .summary-segment { display: inline-flex; align-items: center; min-width: 0; gap: 5px; }
    .summary-icon { flex: 0 0 auto; font-weight: 800; }
    .summary-text { min-width: 0; overflow-wrap: anywhere; }
    .summary-filter-label { color: var(--muted); }
    .summary-separator { flex: 0 0 auto; margin: 0 5px; color: var(--muted); }
    .summary-segment.clear .summary-icon, .summary-segment.clear .summary-text { color: var(--success); }
    .summary-segment.attention .summary-icon, .summary-segment.attention .summary-text { color: var(--danger); }
    .summary-segment.review .summary-icon, .summary-segment.review .summary-text { color: var(--warning); }
    .summary-segment.incomplete .summary-icon, .summary-segment.incomplete .summary-text { color: var(--muted); }
    .calendar-review { margin: 12px; padding: 12px; border: 1px solid color-mix(in srgb, var(--brand) 38%, var(--line)); background: var(--brand-soft); }
    .calendar-review-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .calendar-review-head h3 { font-size: 14px; }
    .calendar-facts { display: grid; grid-template-columns: repeat(5, minmax(110px, 1fr)); gap: 8px; }
    .calendar-fact { min-width: 0; padding: 7px 8px; border: 1px solid var(--line); background: var(--surface); }
    .calendar-fact-label { display: block; color: var(--muted); font-size: 10px; font-weight: 680; text-transform: uppercase; letter-spacing: .04em; }
    .calendar-fact-value { display: block; margin-top: 2px; font-weight: 680; overflow-wrap: anywhere; }
    .calendar-review-lists { display: grid; grid-template-columns: minmax(240px, .9fr) minmax(300px, 1.1fr); gap: 10px; margin-top: 10px; }
    .calendar-list { min-width: 0; padding: 9px; border: 1px solid var(--line); background: var(--surface); }
    .calendar-list h3 { margin-bottom: 6px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    .calendar-list-items { display: grid; gap: 6px; }
    .calendar-row { display: grid; grid-template-columns: minmax(125px, .8fr) minmax(140px, 1.2fr); gap: 8px; align-items: start; min-width: 0; }
    .calendar-row + .calendar-row { padding-top: 6px; border-top: 1px solid var(--line); }
    .calendar-row-label { font-weight: 680; overflow-wrap: anywhere; }
    .calendar-row-value { color: var(--muted); overflow-wrap: anywhere; }
    .calendar-reason { display: block; margin-top: 2px; font-size: 11px; }
    .review-group { margin: 12px; background: light-dark(#fbfcfd, #131c25); }
    .review-group[open] > summary .group-head { border-bottom: 1px solid var(--line); }
    .group-kind { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    .week-review.exception, .weekly-summary.exception { --finding-color: var(--danger); }
    .week-review.review-item, .weekly-summary.review-item { --finding-color: var(--warning); }
    .week-review.could-not-check, .weekly-summary.could-not-check { --finding-color: var(--muted); }
    .week-review.clear { --finding-color: var(--success); }
    .week-review { display: flex; align-items: flex-start; gap: 9px; margin: 10px 12px 0; padding: 10px 11px; border-left: 3px solid var(--finding-color); background: color-mix(in srgb, var(--finding-color) 10%, transparent); color: var(--finding-color); }
    .week-review strong { display: block; color: inherit; }
    .entries { display: grid; gap: 8px; padding: 10px 12px 12px; }
    .entry { display: grid; grid-template-columns: minmax(115px, .7fr) minmax(220px, 1.5fr) minmax(170px, 1fr); gap: 12px; align-items: center; min-height: 76px; padding: 11px 12px; border: 1px solid var(--line); background: var(--surface); }
    .entry-hours { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .finding, .entry-finding > .clear, .entry-finding > .could-not-check, .entry-finding > span:not(.review-summary) .exception, .entry-finding > span:not(.review-summary) .could-not-check { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
    .finding { color: var(--warning); }
    .finding::before { content: "△"; font-weight: 800; }
    .entry-finding > span:not([class]) { display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .entry-finding .clear { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--success); }
    .entry-finding .clear::before { content: "✓"; font-weight: 800; }
    .entry-finding > .clear { color: var(--success); }
    .entry-finding > .clear::before { content: "✓"; font-weight: 800; }
    .entry-finding > .exception { color: var(--danger); }
    .entry-finding > .exception::before { content: "!"; font-weight: 800; }
    .entry-finding > .could-not-check { color: var(--muted); }
    .entry-finding > .could-not-check::before { content: "?"; font-weight: 800; }
    .entry-finding > span:not(.review-summary) .exception { color: var(--danger); }
    .entry-finding > span:not(.review-summary) .exception::before { content: "!"; font-weight: 800; }
    .entry-finding > span:not(.review-summary) .could-not-check { color: var(--muted); }
    .entry-finding > span:not(.review-summary) .could-not-check::before { content: "?"; font-weight: 800; }
    .footer-note { margin-top: 12px; color: var(--muted); font-size: 11px; text-align: right; }
    @media (max-width: 850px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } .filter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .calendar-facts { grid-template-columns: repeat(3, minmax(110px, 1fr)); } .calendar-review-lists { grid-template-columns: 1fr; } .entry { grid-template-columns: minmax(110px, .7fr) minmax(190px, 1.3fr); } .entry-finding { grid-column: 1 / -1; } }
    @media (max-width: 560px) { .dashboard { width: 100%; margin: 0; border-radius: 0; } .shell { padding: 14px; } .page-head, .owner-head, .group-head { align-items: flex-start; flex-direction: column; } .head-meta { justify-items: start; text-align: left; } .status-line { justify-content: flex-start; } .metrics, .filter-grid, .calendar-facts { grid-template-columns: 1fr; } .weekly-summary, .coverage { grid-template-columns: 1fr; } .owner-totals { justify-items: start; text-align: left; } .review-summary { justify-content: flex-start; } .calendar-row { grid-template-columns: 1fr; gap: 2px; } .entry { grid-template-columns: 1fr; } .entry-finding { grid-column: auto; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="dashboard" id="time-dashboard" aria-label="Time approval review dashboard">
    <div class="product-bar"><span class="product-mark">Time Approval | Account:</span><span class="product-section" id="account-label"></span></div>
    <main class="shell">
      <header class="page-head">
        <div><h1 id="scope-title">Pending Actual Time</h1><p class="scope" id="scope-label"></p></div>
        <div class="head-meta"><div class="status-line"><span class="status-dot" aria-hidden="true"></span><strong id="refresh-status"></strong><span aria-hidden="true">·</span><span id="refresh-time"></span></div></div>
      </header>
      <section class="metrics" id="metrics" aria-label="Full-scope summary"><article class="metric"></article><article class="metric"></article><article class="metric"></article><article class="metric"></article><article class="metric"></article><article class="metric"></article></section>
      <section class="coverage" aria-labelledby="coverage-title"><h2 class="coverage-title" id="coverage-title">Check coverage</h2><div class="coverage-items" id="coverage-items"></div></section>
      <section class="browse" aria-labelledby="browse-title">
        <div class="browse-head"><div><h2 id="browse-title">Browse results</h2><p class="browse-note">These controls change only this local view. Full-scope tiles remain unchanged.</p></div><div class="button-row"><button type="button" id="expand-all">Expand all</button><button type="button" id="collapse-all">Collapse all</button></div></div>
        <div class="filter-grid">
          <label class="field" for="search-filter">Search displayed entries<input id="search-filter" type="search" placeholder="Resource, project, customer, item, entry ID"></label>
          <label class="field" for="owner-filter">Resource<select id="owner-filter"><option value="all">All displayed resources</option></select></label>
          <label class="field" for="finding-filter">Finding<select id="finding-filter"><option value="all">All findings</option><option value="exception">Has exception</option><option value="review-item">Has review item</option><option value="could-not-check">Could not check</option><option value="clear">No issues found</option></select></label>
          <label class="field" for="sort-order">Sort displayed entries<select id="sort-order"><option value="owner">Resource A–Z</option><option value="date-desc">Date, newest first</option><option value="date-asc">Date, oldest first</option><option value="hours-desc">Hours, highest first</option></select></label>
        </div>
      </section>
      <section class="list-status" aria-label="Displayed sample status"><div><p class="filtered-view" id="filtered-view" aria-live="polite"></p><p class="subtle" id="sample-note"></p></div></section>
      <section class="weekly-summary" aria-labelledby="weekly-summary-title"><span class="weekly-icon" aria-hidden="true">⚠</span><div><h2 id="weekly-summary-title">Weekly review</h2><p id="weekly-summary-copy"></p></div></section>
      <section class="owner-list" id="owner-groups" aria-label="Actual Time entries grouped by resource and review group"></section>
      <p class="footer-note">This HTML snapshot cannot call Connector tools or change NetSuite records.</p>
    </main>
  </div>
  <script type="application/json" id="dashboard-model">__TIME_APPROVAL_REVIEW_MODEL__</script>
  <script type="module">
    (() => {
      'use strict';
      const model = JSON.parse(document.getElementById('dashboard-model').textContent);
      const $ = (id) => document.getElementById(id);
      const groupRows = () => model.owners.flatMap((owner) => owner.reviewGroups.map((group) => ({ owner, group })));
      const entryRows = () => groupRows().flatMap(({ owner, group }) => group.entries.map((entry) => ({ owner, group, entry })));
      const ownerFilterValue = (owner) => `${owner.ownerKind}:${String(owner.internalId)}`;
      const expansionKeys = () => [...model.owners.map((owner) => `owner:${ownerFilterValue(owner)}`), ...groupRows().map(({ group }) => group.key)];
      const supportedSorts = new Set(['owner', 'date-desc', 'date-asc', 'hours-desc']);
      const normalizeSort = (value) => supportedSorts.has(value) ? value : 'owner';
      const state = { query: '', owner: 'all', finding: 'all', sort: normalizeSort(model.display.sort), expanded: new Set(model.display.expanded === 'all' ? expansionKeys() : []) };
      const formatHours = (value) => Number.isInteger(value) ? String(value) : Number(value).toFixed(1);
      function headerTotalsText(matchingEntries, originalEntries, active) {
        const originalCount = originalEntries.length;
        const originalHours = originalEntries.reduce((sum, entry) => sum + entry.hours, 0);
        const noun = originalCount === 1 ? 'entry' : 'entries';
        if (!active) return `${originalCount} ${noun} · ${formatHours(originalHours)} hours`;
        const matchingHours = matchingEntries.reduce((sum, entry) => sum + entry.hours, 0);
        return `${matchingEntries.length} of ${originalCount} ${noun} · ${formatHours(matchingHours)} of ${formatHours(originalHours)} hours`;
      }
      const locale = model.locale || 'en-US';
      function resolveDisplayTimeZone(candidate) {
        if (!candidate) return 'UTC';
        try {
          new Intl.DateTimeFormat('en-US', { timeZone: candidate }).format(0);
          return candidate;
        } catch {
          return 'UTC';
        }
      }
      const displayTimeZone = resolveDisplayTimeZone(model.timeZone);
      const dateFormatter = new Intl.DateTimeFormat(locale, { dateStyle: 'medium', timeZone: 'UTC' });
      const timestampFormatter = new Intl.DateTimeFormat(locale, { dateStyle: 'medium', timeStyle: 'short', timeZone: displayTimeZone });
      const formatDate = (value) => dateFormatter.format(new Date(`${value}T00:00:00Z`));
      const period = (value) => `${formatDate(value.startDate)} – ${formatDate(value.endDate)}`;
      const formatTimestamp = (value) => value ? timestampFormatter.format(new Date(value)) : 'Not available';
      const initials = (name) => name.split(/\s+/).map((part) => part[0]).join('').slice(0, 2).toUpperCase();
      const coverageText = (value) => `${value[0].toUpperCase()}${value.slice(1)}`;
      const weekdayLabels = { sunday: 'Su', monday: 'M', tuesday: 'T', wednesday: 'W', thursday: 'Th', friday: 'F', saturday: 'Sa' };
      const configuredWeekdaysText = (review) => review.configuredWorkingWeekdayCount === null || review.configuredWorkingWeekdays === null
        ? 'Not available'
        : `${review.configuredWorkingWeekdayCount} (${review.configuredWorkingWeekdays.map((weekday) => weekdayLabels[weekday] || weekday).join(',')})`;
      const thresholdLabels = { 'entry-minimum': 'Entry minimum', 'working-day-minimum': 'Working-day minimum', 'working-day-maximum': 'Working-day maximum', 'weekly-minimum': 'Weekly minimum', 'weekly-maximum': 'Weekly maximum' };
      const groupFindings = (group) => (group.findingIds || []).map((id) => model.weeklyFindings.find((finding) => finding.id === id)).filter(Boolean);
      const blockingReadiness = new Set(['exception', 'review-item', 'could-not-check']);
      const ownerHasIncompleteEvidence = (owner) => Boolean(owner.calendarReview && owner.calendarReview.aggregateCoverage.status !== 'complete');
      const entryCategory = ({ owner, entry }) => {
        if (entry.findings.some((finding) => finding.classification === 'exception')) return 'exception';
        if (entry.findings.some((finding) => finding.classification === 'review-item')) return 'review-item';
        if (entry.findings.some((finding) => finding.classification === 'could-not-check')
            || ownerHasIncompleteEvidence(owner)) return 'could-not-check';
        return 'clear';
      };
      const entryCategoryCounts = (rows) => {
        const counts = { exceptionCount: 0, reviewItemCount: 0, incompleteCount: 0, clearEntryCount: 0 };
        for (const row of rows) {
          const category = entryCategory(row);
          if (category === 'exception') counts.exceptionCount += 1;
          else if (category === 'review-item') counts.reviewItemCount += 1;
          else if (category === 'could-not-check') counts.incompleteCount += 1;
          else counts.clearEntryCount += 1;
        }
        return counts;
      };
      const summaryParts = (rollup) => {
        const parts = [];
        if (rollup.exceptionCount) parts.push({ modifier: 'attention', icon: '!', text: `Requires attention: ${countLabel(rollup.exceptionCount, 'entry')}` });
        if (rollup.reviewItemCount) parts.push({ modifier: 'review', icon: '△', text: `Needs review: ${countLabel(rollup.reviewItemCount, 'entry')}` });
        if (rollup.incompleteCount) parts.push({ modifier: 'incomplete', icon: '?', text: `Incomplete checks: ${countLabel(rollup.incompleteCount, 'entry')}` });
        if (state.finding === 'all' || state.finding === 'clear') {
          parts.push({ modifier: 'clear', icon: '✓', text: `No issues found: ${countLabel(rollup.clearEntryCount, 'entry')}` });
        }
        return parts;
      };
      const reviewSummary = (rollup) => {
        const parts = summaryParts(rollup);
        const rootModifier = parts.some((part) => part.modifier === 'attention') ? 'exception' : parts.some((part) => part.modifier === 'review') ? 'review-item' : parts.some((part) => part.modifier === 'incomplete') ? 'could-not-check' : 'clear';
        const summary = el('span', `review-summary ${rootModifier}`);
        parts.forEach((part, index) => {
          const segment = el('span', `summary-segment ${part.modifier}`);
          if (index) segment.append(el('span', 'summary-separator', ' · '));
          segment.append(el('span', `summary-icon ${part.modifier}`, part.icon), text(' '), el('span', `summary-text ${part.modifier}`, part.text));
          segment.querySelector('.summary-icon').setAttribute('aria-hidden', 'true');
          summary.append(segment);
        });
        return summary;
      };
      const groupNoun = model.scope.weeklyTimeMode === 'weekly-timesheets' ? 'timesheet' : 'week';
      const countLabel = (count, singular) => `${count} ${count === 1 ? singular : singular === 'entry' ? 'entries' : `${singular}s`}`;
      const groupTextMatches = (owner, group) => {
        const haystack = [owner.name, ownerKindLabel(owner.ownerKind), owner.ownerKind, owner.internalId, group.reference, ...group.entries.flatMap((entry) => [entry.reference, entry.internalId, entry.project, entry.customer, entry.serviceItem, entry.memo, entry.date])].filter(Boolean).join(' ').toLowerCase();
        return !state.query || haystack.includes(state.query);
      };
      const entryMatches = ({ owner, group, entry }) => {
        const haystack = [owner.name, ownerKindLabel(owner.ownerKind), owner.ownerKind,
          owner.internalId, group.reference, entry.reference, entry.internalId,
          entry.project, entry.customer, entry.serviceItem, entry.memo, entry.date]
          .filter(Boolean).join(' ').toLowerCase();
        const findingMatch = state.finding === 'all'
          || (state.finding === 'clear' && entryCategory({ owner, entry }) === 'clear')
          || (state.finding === 'could-not-check' && ownerHasIncompleteEvidence(owner))
          || (state.finding !== 'clear' && entry.findings.some(
            (finding) => finding.classification === state.finding));
        return (!state.query || haystack.includes(state.query))
          && (state.owner === 'all' || ownerFilterValue(owner) === state.owner)
          && findingMatch;
      };

      const filtersAreActive = () => Boolean(state.query
        || state.owner !== 'all' || state.finding !== 'all');
      const findingMatchesFilter = (finding) => state.finding === 'all'
        || (state.finding === 'clear' && !blockingReadiness.has(finding.classification))
        || finding.classification === state.finding;

      function computeFilteredView() {
        const groups = [];
        for (const { owner, group } of groupRows()) {
          if (state.owner !== 'all' && ownerFilterValue(owner) !== state.owner) continue;
          if (!groupTextMatches(owner, group)) continue;
          const incompleteCalendar = ownerHasIncompleteEvidence(owner);
          const entries = group.entries
            .filter((entry) => entryMatches({ owner, group, entry }))
            .map((entry) => ({ owner, group, entry,
              findings: entry.findings,
              incompleteCalendar }));
          const findings = groupFindings(group).filter(findingMatchesFilter);
          const matches = state.finding === 'all'
            || (state.finding === 'clear' ? entries.length > 0
              : findings.length > 0 || entries.length > 0);
          if (!matches) continue;
          const summary = entryCategoryCounts(entries);
          groups.push({ owner, group, entries, findings, summary });
        }
        const ownerSummaries = new Map();
        for (const owner of model.owners) {
          const ownedGroups = groups.filter((row) => row.owner === owner);
          ownerSummaries.set(owner, entryCategoryCounts(ownedGroups.flatMap((row) => row.entries)));
        }
        const weeklyFindings = [...new Map(groups.flatMap((row) => row.findings)
          .map((finding) => [finding.id, finding])).values()];
        return {
          active: filtersAreActive(),
          groups,
          entries: groups.flatMap((row) => row.entries),
          ownerSummaries,
          weeklyFindings,
          blockingWeeklyFindings: weeklyFindings.filter(
            (finding) => blockingReadiness.has(finding.classification)),
        };
      }
      const text = (value) => document.createTextNode(value == null ? '' : String(value));
      const el = (tag, className, value) => { const node = document.createElement(tag); if (className) node.className = className; if (value !== undefined) node.append(text(value)); return node; };
      const accountDisplay = model.account.source === 'session'
        ? `${model.account.accountId} · ${model.account.environmentType} · NetSuite ${model.account.version}`
        : model.account.connectionName;
      const recordUrl = (recordType, internalId) => {
        const evidence = (model.navigation || []).find(item => item.recordType === recordType && String(item.internalId) === String(internalId));
        if (!evidence) return null;
        try { const url = new URL(evidence.url); return url.protocol === 'https:' && !url.username && !url.password && url.origin === evidence.accountOrigin ? url.href : null; } catch { return null; }
      };
      const recordLink = (label, href, className) => { if (!href) return el('span', className, label); const link = el('a', className, label); link.href = href; link.target = '_blank'; link.rel = 'noopener noreferrer'; return link; };
      function findingsForEntry(entryRow) {
        if (!entryRow.findings.length && !entryRow.incompleteCalendar) {
          return el('span', 'clear', 'No issues found');
        }
        const wrap = el('span');
        entryRow.findings.forEach((finding) => {
          const kind = finding.classification === 'exception' ? 'exception'
            : finding.classification === 'could-not-check' ? 'could-not-check'
            : finding.classification === 'review-item' ? 'finding' : 'clear';
          wrap.append(el('span', kind, finding.title));
        });
        if (entryRow.incompleteCalendar) {
          wrap.append(el('span', 'could-not-check', 'Could not check · incomplete coverage'));
        }
        return wrap;
      }

      function filteredReviewSummary(rollup, active) {
        const summary = reviewSummary(rollup);
        if (active) {
          const first = summary.querySelector('.summary-segment');
          if (first) first.prepend(el('span', 'summary-separator', ' · '));
          summary.prepend(el('span', 'summary-filter-label', 'Filtered findings'));
        }
        return summary;
      }
      function findingAppearance(classification) {
        if (classification === 'exception') return { modifier: 'exception', icon: '!' };
        if (classification === 'review-item') return { modifier: 'review-item', icon: '△' };
        if (classification === 'could-not-check') return { modifier: 'could-not-check', icon: '?' };
        return { modifier: 'clear', icon: '✓' };
      }

      function findingNode(finding) {
        const appearance = findingAppearance(finding.classification);
        const node = el('div', `week-review ${appearance.modifier}`);
        const icon = el('span', 'week-finding-icon', appearance.icon);
        icon.setAttribute('aria-hidden', 'true');
        const copy = el('div');
        copy.append(el('strong', '', finding.title), text(finding.summary));
        node.append(icon, copy);
        return node;
      }
      function calendarFact(label, value) { const fact = el('div', 'calendar-fact'); fact.append(el('span', 'calendar-fact-label', label), el('span', 'calendar-fact-value', value)); return fact; }
      function calendarReviewNode(owner, review) {
        const section = el('section', 'calendar-review');
        section.setAttribute('aria-label', `${ownerKindLabel(owner.ownerKind)} ${owner.name} calendar review`);
        const head = el('div', 'calendar-review-head');
        head.append(el('h3', '', 'Calendar review'), el('span', 'subtle', `Retrieved ${formatTimestamp(review.retrievedAt)}`));
        section.append(head);
        const facts = el('div', 'calendar-facts');
        facts.append(
          calendarFact('Source', review.source === 'assigned' ? 'Assigned' : review.source === 'default' ? 'Default' : 'Not available'),
          calendarFact('Calendar coverage', coverageText(review.calendarCoverage)),
          calendarFact('Holiday coverage', coverageText(review.holidayCoverage)),
          calendarFact('Hours per day', review.workHoursPerDay === null ? 'Not available' : formatHours(review.workHoursPerDay)),
          calendarFact('Configured days/week', configuredWeekdaysText(review)),
        );
        section.append(facts);
        const lists = el('div', 'calendar-review-lists');
        const thresholds = el('section', 'calendar-list'); thresholds.append(el('h3', '', 'Effective thresholds'));
        const thresholdItems = el('div', 'calendar-list-items');
        const populationGroupLabel = (evidence) => {
          if (!evidence.reviewGroupKey) return null;
          const group = owner.reviewGroups.find((candidate) => candidate.key === evidence.reviewGroupKey);
          if (!group) return 'Review group unavailable';
          return group.kind === 'timesheet' ? `Timesheet ${group.internalId}` : period(group.period);
        };
        if (!review.effectiveThresholds.length) thresholdItems.append(el('span', 'subtle', 'No effective thresholds supplied.'));
        review.effectiveThresholds.forEach((threshold) => {
          const row = el('div', 'calendar-row'); row.append(el('span', 'calendar-row-label', thresholdLabels[threshold.checkId]));
          const value = el('span', 'calendar-row-value');
          const source = threshold.source === 'work-calendar' ? 'Work calendar' : threshold.source === 'explicit' ? 'Explicit' : null;
          const amount = threshold.status === 'available' ? `${threshold.minutes} minutes` : 'Not available';
          value.append(text(`${amount} · ${threshold.status}${source ? ` · ${source}` : ''}`));
          const groupLabel = threshold.populationEvidence && populationGroupLabel(threshold.populationEvidence);
          if (groupLabel) value.append(el('span', 'calendar-reason', groupLabel));
          if (threshold.reason) value.append(el('span', 'calendar-reason', threshold.reason));
          if (threshold.populationEvidence) {
            const evidence = threshold.populationEvidence;
            const observed = evidence.basis === 'lower-bound' ? `At least ${evidence.observedMinutes}` : String(evidence.observedMinutes);
            value.append(el('span', 'calendar-reason', `Observed: ${observed} minutes${evidence.date ? ` on ${formatDate(evidence.date)}` : ''} · ${evidence.conclusion} · ${evidence.populationCoverage} population`));
            if (evidence.reason) value.append(el('span', 'calendar-reason', evidence.reason));
          }
          row.append(value); thresholdItems.append(row);
        });
        review.populationEvidence.forEach((evidence) => {
          const row = el('div', 'calendar-row'); row.append(el('span', 'calendar-row-label', evidence.checkId === 'daily-over-24-hours' ? 'Daily over 24 hours' : evidence.checkId));
          const value = el('span', 'calendar-row-value');
          const observed = evidence.observedMinutes === null ? 'Not available' : evidence.basis === 'lower-bound' ? `At least ${evidence.observedMinutes}` : String(evidence.observedMinutes);
          value.append(text(`Observed: ${observed}${evidence.date ? ` minutes on ${formatDate(evidence.date)}` : ' minutes'} · ${evidence.conclusion} · ${evidence.populationCoverage} population`));
          const groupLabel = populationGroupLabel(evidence);
          if (groupLabel) value.append(el('span', 'calendar-reason', groupLabel));
          if (evidence.reason) value.append(el('span', 'calendar-reason', evidence.reason));
          row.append(value); thresholdItems.append(row);
        });
        thresholds.append(thresholdItems);
        const dates = el('section', 'calendar-list'); dates.append(el('h3', '', 'Date facts'));
        const dateItems = el('div', 'calendar-list-items');
        if (!review.dateFacts.length) dateItems.append(el('span', 'subtle', 'No date facts supplied.'));
        review.dateFacts.forEach((fact) => {
          const row = el('div', 'calendar-row'); row.append(el('span', 'calendar-row-label', formatDate(fact.date)));
          const value = el('span', 'calendar-row-value');
          const classification = fact.coverage !== 'complete' || fact.workingDay === null || fact.holiday === null ? 'Incomplete' : fact.holiday ? 'Holiday · Non-working' : fact.workingDay ? 'Working' : 'Non-working';
          value.append(text(`${classification} · ${coverageText(fact.coverage)} coverage`));
          if (fact.reason) value.append(el('span', 'calendar-reason', fact.reason));
          row.append(value); dateItems.append(row);
        });
        dates.append(dateItems); lists.append(thresholds, dates); section.append(lists); return section;
      }
      function entryCard(entryRow) {
        const { owner, group, entry } = entryRow;
        const row = el('article', 'entry');
        row.dataset.id = String(entry.internalId);
        row.dataset.groupKey = group.key;
        row.dataset.owner = owner.name;
        row.dataset.ownerKind = owner.ownerKind;
        row.dataset.date = entry.date;
        const date = el('div');
        const entryHours = el('span', 'entry-hours');
        entryHours.append(text(`${formatHours(entry.hours)} hours · `),
          recordLink(entry.reference || `Entry ${entry.internalId}`,
            recordUrl('timebill', entry.internalId),
            'record-link'));
        date.append(el('span', 'entry-date', formatDate(entry.date)), entryHours);
        row.append(date);
        const details = el('div');
        details.append(el('span', 'entry-project', entry.project || entry.customer || 'No project/customer'),
          el('span', 'entry-copy', [entry.serviceItem, entry.memo || 'No memo']
            .filter(Boolean).join(' · ')));
        row.append(details);
        const finding = el('div', 'entry-finding');
        finding.append(findingsForEntry(entryRow), el('span', 'entry-copy', entry.status));
        row.append(finding);
        return row;
      }

      function groupCard(groupRow, active) {
        const { group } = groupRow;
        const detail = document.createElement('details');
        detail.className = 'review-group';
        detail.dataset.groupKey = group.key;
        detail.open = state.expanded.has(group.key);
        detail.addEventListener('toggle', () => {
          if (detail.open) state.expanded.add(group.key);
          else state.expanded.delete(group.key);
        });
        const summary = document.createElement('summary');
        const head = el('div', 'group-head');
        const left = el('div', 'summary-main');
        const groupReference = group.kind === 'timesheet'
          ? recordLink(group.reference,
            recordUrl('timesheet', group.internalId),
            'group-title')
          : el('span', 'group-title', group.reference);
        left.append(el('span', 'chevron', '›'),
          el('span', 'group-kind', group.kind === 'timesheet' ? 'Timesheet' : 'Review week'),
          groupReference);
        const right = el('div', 'owner-totals');
        const totalsLine = el('span', 'totals-line');
        const matchingEntries = groupRow.entries.map((row) => row.entry);
        totalsLine.append(text(`${headerTotalsText(matchingEntries, group.entries, active)} · ${period(group.period)}`));
        right.append(totalsLine, filteredReviewSummary(groupRow.summary, active));
        head.append(left, right);
        summary.append(head);
        detail.append(summary);
        groupRow.findings.forEach((finding) => detail.append(findingNode(finding)));
        const entries = el('div', 'entries');
        groupRow.entries.slice().sort((a, b) => {
          if (state.sort === 'date-desc') return b.entry.date.localeCompare(a.entry.date);
          if (state.sort === 'date-asc') return a.entry.date.localeCompare(b.entry.date);
          if (state.sort === 'hours-desc') return b.entry.hours - a.entry.hours;
          return String(a.entry.internalId).localeCompare(String(b.entry.internalId),
            undefined, { numeric: true });
        }).forEach((entryRow) => entries.append(entryCard(entryRow)));
        detail.append(entries);
        return detail;
      }
      function formatPendingMetric(metric) {
        const isEntries = metric.unit === 'entries';
        const unitPattern = isEntries ? /\b(?:entry|entries)\b/i : /\bhours?\b/i;
        if (unitPattern.test(metric.display)) return metric.display;
        const numeric = metric.display.trim().match(
          /^(?:At least )?((?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?)$/);
        if (numeric) {
          const count = Number(numeric[1].replace(/,/g, ''));
          const unit = count === 1 ? (isEntries ? 'entry' : 'hour') : metric.unit;
          return metric.display + ' ' + unit;
        }
        return (isEntries ? 'Entries: ' : 'Hours: ') + metric.display;
      }
      function renderMetrics() {
        const supplied = (key) => model.metrics.find((metric) => metric.key === key);
        const counts = entryCategoryCounts(entryRows());
        const pendingEntries = supplied('pendingEntries');
        const pendingHours = supplied('pendingHours');
        const pendingNotes = [];
        if (pendingEntries.note) pendingNotes.push(`Entries: ${pendingEntries.note}`);
        if (pendingHours.note) pendingNotes.push(`Hours: ${pendingHours.note}`);
        const categoryMetric = (key) => ({ ...supplied(key) });
        const cards = [
          { label: 'Resources included', display: String(model.owners.length), note: 'Resources shown in this review, including verified employees and vendors.' },
          { key: 'pendingEntriesAndHours', label: 'Pending entries and hours', display: formatPendingMetric(pendingEntries) + ' · ' + formatPendingMetric(pendingHours), note: pendingNotes.join(' ') },
          { key: 'entriesWithIncompleteChecks', label: 'Entries with incomplete checks', display: String(counts.incompleteCount), note: 'Entries with incomplete checks and no exception or review item.' },
          { key: 'noIssuesFound', label: 'No issues found', display: countLabel(counts.clearEntryCount, 'entry'), note: 'Entries with no exception, review item, or incomplete check.' },
          categoryMetric('entriesWithExceptions', 'Exceptions', counts.exceptionCount, 'Entries whose highest severity is an exception.'),
          categoryMetric('entriesWithReviewItems', 'Review items', counts.reviewItemCount, 'Entries with review items and no exception.'),
        ];
        const classes = {
          noIssuesFound: 'metric-success',
          entriesWithExceptions: 'metric-danger',
          entriesWithReviewItems: 'metric-warning',
          entriesWithIncompleteChecks: 'metric-muted',
        };
        const metrics = $('metrics');
        metrics.replaceChildren();
        cards.forEach((metric) => {
          const modifier = classes[metric.key];
          const card = el('article', `metric${modifier ? ` ${modifier}` : ''}`);
          card.append(el('span', 'metric-label', metric.label), el('strong', 'metric-value', metric.display), el('span', 'metric-note', metric.note));
          metrics.append(card);
        });
      }
      function renderCoverage() { const container = $('coverage-items'); container.replaceChildren(); model.checkCoverage.forEach((item) => { const statusClass = item.status === 'complete' ? 'coverage-good' : item.status === 'unavailable' || item.status === 'not-configured' ? 'coverage-off' : 'coverage-partial'; container.append(el('span', `coverage-item ${statusClass}`, `${item.label}: ${item.summary}`)); }); }
      function populateHeader() { $('account-label').textContent = accountDisplay; $('scope-label').textContent = `${model.scope.label} · ${model.scope.approvalStatus}`; $('refresh-status').textContent = model.coverage.status === 'complete' ? 'Complete retrieval' : `${model.coverage.status[0].toUpperCase()}${model.coverage.status.slice(1)} retrieval`; $('refresh-time').textContent = `Refreshed ${formatTimestamp(model.refresh.timestamp)}`; }
      function renderWeekly(view) {
        const banner = document.querySelector('#time-dashboard .weekly-summary');
        const groups = view.groups.filter((row) => row.findings.some(
          (finding) => blockingReadiness.has(finding.classification)));
        const findings = view.blockingWeeklyFindings;
        banner.hidden = groups.length === 0;
        if (banner.hidden) {
          $('weekly-summary-copy').textContent = '';
          return;
        }
        const classification = ['exception', 'review-item', 'could-not-check']
          .find((kind) => findings.some((finding) => finding.classification === kind));
        const appearance = findingAppearance(classification);
        banner.className = `weekly-summary ${appearance.modifier}`;
        banner.querySelector('.weekly-icon').textContent = appearance.icon;
        const blocking = findings.some((finding) => finding.classification === 'exception'
          || finding.classification === 'could-not-check');
        const count = groups.length;
        const description = blocking ? 'blocking weekly findings' : 'weekly review items';
        $('weekly-summary-copy').textContent = `${countLabel(count, groupNoun)} ${count === 1 ? 'has' : 'have'} ${description}.`;
      }
      const ownerNameCounts = new Map(model.owners.map((owner) => [owner.name, model.owners.filter((candidate) => candidate.name === owner.name).length]));
      const ownerKindLabel = (kind) => kind === 'employee' ? 'Employee' : kind === 'vendor' ? 'Vendor' : 'Unverified Employee';
      const ownerLabel = (owner) => `${ownerKindLabel(owner.ownerKind)} · ${owner.name}${ownerNameCounts.get(owner.name) > 1 ? ` · ${owner.internalId}` : ''}`;
      const ownerSortKey = (owner) => String(owner.name).trim().toLocaleLowerCase(model.locale || 'en-US');
      function ownerMatchesFilteredView(owner, groups) {
        if (groups.length > 0) return true;
        const hasNoOriginalEntries = owner.reviewGroups.every((group) => group.entries.length === 0);
        const findingMatch = state.finding === 'all'
          ? owner.reviewGroups.length === 0
          : state.finding === 'could-not-check' && ownerHasIncompleteEvidence(owner);
        return hasNoOriginalEntries && findingMatch
          && (state.owner === 'all' || state.owner === ownerFilterValue(owner))
          && (!state.query || ownerLabel(owner).toLowerCase().includes(state.query));
      }
      function rememberExpansionState() { document.querySelectorAll('#time-dashboard details').forEach((details) => { const key = details.classList.contains('owner') ? `owner:${details.dataset.ownerKind}:${details.dataset.ownerId}` : details.dataset.groupKey; if (!key) return; if (details.open) state.expanded.add(key); else state.expanded.delete(key); }); }
      function renderOwners(view) {
        rememberExpansionState();
        const select = $('owner-filter');
        const previous = select.value;
        select.replaceChildren(el('option', '', 'All displayed resources'));
        select.options[0].value = 'all';
        model.owners.forEach((owner) => {
          const option = el('option', '', ownerLabel(owner));
          option.value = ownerFilterValue(owner);
          select.append(option);
        });
        select.value = model.owners.some((owner) => ownerFilterValue(owner) === previous)
          ? previous : 'all';
        const list = $('owner-groups');
        list.replaceChildren();
        const rows = model.owners.map((owner) => ({ owner,
          groups: view.groups.filter((groupRow) => groupRow.owner === owner),
        })).filter(({ owner, groups }) => ownerMatchesFilteredView(owner, groups));
        rows.sort((a, b) => ownerSortKey(a.owner).localeCompare(ownerSortKey(b.owner))
          || a.owner.ownerKind.localeCompare(b.owner.ownerKind)
          || String(a.owner.internalId).localeCompare(String(b.owner.internalId),
            undefined, { numeric: true })).forEach(({ owner, groups }) => {
          const details = document.createElement('details');
          details.className = 'owner';
          const ownerKey = `owner:${ownerFilterValue(owner)}`;
          details.open = state.expanded.has(ownerKey);
          details.dataset.owner = owner.name;
          details.dataset.ownerKind = owner.ownerKind;
          details.dataset.ownerId = String(owner.internalId);
          details.setAttribute('aria-label', `${ownerKindLabel(owner.ownerKind)} ${owner.name} review`);
          details.addEventListener('toggle', () => {
            if (details.open) state.expanded.add(ownerKey);
            else state.expanded.delete(ownerKey);
          });
          const summary = document.createElement('summary');
          const head = el('div', 'owner-head');
          const left = el('div', 'summary-main');
          left.append(el('span', 'chevron', '›'), el('span', 'avatar', initials(owner.name)));
          const title = el('span');
          title.append(el('span', 'name', owner.name), document.createElement('br'),
            el('span', 'subtle', `${ownerKindLabel(owner.ownerKind)} ${owner.internalId}`));
          left.append(title);
          const originalEntries = owner.reviewGroups.flatMap((group) => group.entries);
          const matchingEntries = groups.flatMap((groupRow) => groupRow.entries.map((row) => row.entry));
          const totals = el('div', 'owner-totals');
          totals.append(el('strong', 'totals-line',
            headerTotalsText(matchingEntries, originalEntries, view.active)),
            filteredReviewSummary(view.ownerSummaries.get(owner), view.active));
          head.append(left, totals);
          summary.append(head);
          details.append(summary);
          if (owner.calendarReview) details.append(calendarReviewNode(owner, owner.calendarReview));
          groups.forEach((groupRow) => details.append(groupCard(groupRow, view.active)));
          list.append(details);
        });
      }

      function refreshStatus(view) {
        const allRows = entryRows();
        const visibleHours = view.entries.reduce((sum, row) => sum + row.entry.hours, 0);
        const totalHours = allRows.reduce((sum, row) => sum + row.entry.hours, 0);
        $('filtered-view').textContent = `${view.active ? 'Filtered view' : 'No filters applied'}: ${view.entries.length} of ${allRows.length} displayed entries · ${formatHours(visibleHours)} of ${formatHours(totalHours)} displayed hours`;
        $('sample-note').textContent = `${model.paging.displayed.sampleOnly ? 'Showing a sample' : 'Showing'} ${allRows.length} entries from ${model.metrics.find((metric) => metric.key === 'pendingEntries').display} full-scope pending entries. Local filters do not change full-scope totals.`;
      }

      function renderFilteredResults() {
        const view = computeFilteredView();
        renderOwners(view);
        renderWeekly(view);
        refreshStatus(view);
      }

      function applyAndRender() {
        state.query = $('search-filter').value.trim().toLowerCase();
        state.owner = $('owner-filter').value;
        state.finding = $('finding-filter').value;
        state.sort = normalizeSort($('sort-order').value);
        $('sort-order').value = state.sort;
        renderFilteredResults();
      }

      $('search-filter').addEventListener('input', applyAndRender);
      $('owner-filter').addEventListener('change', applyAndRender);
      $('finding-filter').addEventListener('change', applyAndRender);
      $('sort-order').addEventListener('change', applyAndRender);

      function setAllExpanded(expanded) {
        state.expanded.clear();
        if (expanded) expansionKeys().forEach((key) => state.expanded.add(key));
        document.querySelectorAll('#time-dashboard details').forEach((node) => {
          node.open = expanded;
        });
      }

      $('expand-all').addEventListener('click', () => setAllExpanded(true));
      $('collapse-all').addEventListener('click', () => setAllExpanded(false));
      $('sort-order').value = state.sort;
      populateHeader();
      renderMetrics();
      renderCoverage();
      renderFilteredResults();
    })();
  </script>
</body>
</html>
