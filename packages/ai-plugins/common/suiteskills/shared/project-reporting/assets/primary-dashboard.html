/* Redwood / NetSuite design tokens (v1.3). Source: NetSuite Corporate Brand Guidelines (Feb 2024) + Redwood Colors (Mar 2021).
   Use the variables, never raw hex, in dashboards. Values are inherited from the supplied skill: do not tint, blend, or create gradients.
   Light is the default. Dark ("Ocean") is the deck-style theme: set <html data-theme="ocean-dark">. */
:root {
  /* NetSuite signature */
  --rw-ocean-180: #13212C; --rw-ocean-150: #264759; --rw-ocean-120: #36677D; --rw-ocean-100: #437C94;
  --rw-ocean-60: #94BFCE;  --rw-ocean-40: #D0E5ED;  --rw-ocean-30: #E7F2F5;  --rw-ocean-10: #F5FAFC;
  --rw-yellow-160: #E2C06B;
  /* NetSuite secondary */
  --rw-coral: #FF8675; --rw-sage: #86B596;
  /* Oracle signature + Redwood pillars (accents only) */
  --rw-red: #C74634; --rw-bark: #312D2A; --rw-yellow: #F0CC71; --rw-brand-green: #5F7D4F; --rw-beige-40: #E9E1CA;
  --rw-slate-60: #A9BBBC; --rw-slate-pine: #697778; --rw-rose: #A36472; --rw-pebble: #6F757E; --rw-teal: #4F7D7B;
  --rw-plum: #796087; --rw-lilac: #6B7494; --rw-sienna: #AA643B; --rw-neutral: #7A736E; --rw-pine: #4C825C;
  /* Functional (source palette) */
  --rw-link-light: #00688C; --rw-link-dark: #F0CC71; --rw-text-light: #161513; --rw-text-dark: #FFFFFF;

  /* Semantic roles, light theme */
  /* Chart series palette (NetSuite UI Toolkit data-visualization specs). Order matters: use 1, 2, 3... in sequence. */
  --rw-series-1: #245D63; --rw-series-2: #D7790F; --rw-series-3: #31A09C; --rw-series-4: #4E4137; --rw-series-5: #699E61; --rw-series-6: #B47282;
  --rw-series-7: #83401E; --rw-series-8: #9E7FCC; --rw-series-9: #A88E00; --rw-series-10: #58316E; --rw-series-11: #5999B5; --rw-series-12: #317A45;
  --rw-surface: #FBF9F8; --rw-page: #F1EFED;   /* NetSuite UI Toolkit dashboard: page #F1EFED, portlets #FBF9F8, flat, no border/shadow */ --rw-chart-grid: #DFDDDC; --rw-chart-label: #5A5857;

  --ns-page: var(--rw-page);           --ns-canvas: transparent;      --ns-card: var(--rw-surface);
  --ns-ink: var(--rw-text-light);      --ns-ink-muted: #4A4F54;       /* 8.1:1 on white; do not go lighter for text */
  --ns-line: var(--rw-chart-grid);       --ns-line-strong: var(--rw-ocean-60);
  --ns-table-head: transparent;
  --ns-primary: var(--rw-series-1);    --ns-primary-strong: var(--rw-ocean-150);
  --ns-compare: var(--rw-series-2);    --ns-highlight: var(--rw-series-2);
  --ns-pos: var(--rw-pine);            --ns-neg: var(--rw-red);
  --ns-link: var(--rw-link-light);     --ns-focus: var(--rw-link-light);
  --ns-chip-bg: var(--rw-yellow-160);  --ns-chip-ink: var(--rw-ocean-180);
  --ns-grid: var(--rw-chart-grid);     --ns-axis: var(--rw-chart-label);   --ns-chart-label: var(--rw-chart-label);

  /* Categorical series: the Redwood chart palette, in order (check mark contrast in context; never use series colors as text) */
  --ns-series-1: var(--rw-series-1); --ns-series-2: var(--rw-series-2); --ns-series-3: var(--rw-series-3); --ns-series-4: var(--rw-series-4);
  --ns-series-5: var(--rw-series-5); --ns-series-6: var(--rw-series-6); --ns-series-7: var(--rw-series-7); --ns-series-8: var(--rw-series-8);
  --ns-series-9: var(--rw-series-9); --ns-series-10: var(--rw-series-10); --ns-series-11: var(--rw-series-11); --ns-series-12: var(--rw-series-12);

  /* Type */
  --ns-font:  "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --ns-font-serif: Georgia, "Times New Roman", serif;
  --ns-radius: 10px; --ns-radius-lg: 14px;
}
:is([data-theme="ocean-dark"],[data-theme="dark"]) {
  --ns-page: var(--rw-ocean-180);      --ns-canvas: transparent;          --ns-card: var(--rw-ocean-150);
  --ns-ink: var(--rw-text-dark);       --ns-ink-muted: var(--rw-ocean-40);
  --ns-line: var(--rw-ocean-120);      --ns-line-strong: var(--rw-ocean-60);
  --ns-table-head: transparent;
  --ns-primary: var(--rw-ocean-60);    --ns-primary-strong: var(--rw-ocean-40);
  --ns-compare: var(--rw-yellow-160);  --ns-highlight: var(--rw-yellow-160);
  --ns-pos: var(--rw-sage);            --ns-neg: var(--rw-coral);
  --ns-link: var(--rw-link-dark);      --ns-focus: var(--rw-yellow);
  --ns-chip-bg: var(--rw-yellow-160);  --ns-chip-ink: var(--rw-ocean-180);
  --ns-grid: var(--rw-ocean-120);      --ns-axis: var(--rw-ocean-40);   --ns-chart-label: var(--rw-ocean-40);
  /* The NetSuite UI Toolkit chart specs are light-surface only; dark uses brand colors; check mark contrast on the actual surface */
  --ns-primary: var(--rw-ocean-60);    --ns-compare: var(--rw-yellow-160);
  --ns-series-1: var(--rw-ocean-60);   --ns-series-2: var(--rw-yellow-160);  --ns-series-3: var(--rw-coral);   --ns-series-4: var(--rw-sage);
  --ns-series-5: var(--rw-ocean-40);   --ns-series-6: var(--rw-slate-60);    --ns-series-7: var(--rw-lilac);   --ns-series-8: var(--rw-teal);
  --ns-series-9: var(--rw-rose);       --ns-series-10: var(--rw-sienna);     --ns-series-11: var(--rw-pine);   --ns-series-12: var(--rw-plum);
}
body { font-family: var(--ns-font); color: var(--ns-ink); background: var(--ns-page); font-feature-settings: "tnum" 1, "lnum" 1; }
:focus-visible { outline: 2px solid var(--ns-focus); outline-offset: 2px; }
a { color: var(--ns-link); }
/* Georgia Serif: Regular/Italic only. Never bold (brand rule). */
.ns-serif { font-family: var(--ns-font-serif); font-weight: 400; }
/* Data textures: uniform scale only (background-size: cover keeps aspect ratio). Backdrops and header bands only. */
[class*="ns-tex-"] { background-repeat: no-repeat; background-position: center; background-size: cover; }
/* Texture as a quiet backdrop layer: put <div class="ns-tex-layer ns-tex-chevron-white" aria-hidden="true"></div> as the first child of a
   position:relative band; other children need position:relative. Default .05; keep at or below .08 so text stays dominant. */
.ns-tex-layer { position: absolute; inset: 0; opacity: var(--ns-tex-opacity, .05); pointer-events: none; }

/* Portlet: flat surface on the grey page, 10px radius, no border or shadow (matches the NetSuite UI Toolkit dashboard). */
.ns-portlet { background: var(--ns-card); border-radius: var(--ns-radius); padding: 14px 16px; }
@media print { .ns-portlet, .card, .kpi { border: 1px solid var(--ns-line) !important; } }

/* Report header (matches the Redwood report header): textured strip on top, Ocean 150 band, yellow breadcrumb + link,
   bold white title, actions on the right. The strip image is injected by build_dashboard.py. Do not recolor or stretch it. */
.ns-strip { height: 7px; background-size: cover; background-position: center; background-repeat: no-repeat; background-color: var(--rw-ocean-150); }
.ns-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 14px 28px 18px; background: var(--rw-ocean-150); color: #fff; }
.ns-header .ns-crumb { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--rw-link-dark); }
.ns-header h1 { margin: 2px 0 6px; font-family: var(--ns-font); font-size: 26px; line-height: 1.15; font-weight: 700; color: #fff; }
.ns-header .ns-link { font-size: 13px; font-weight: 600; color: var(--rw-link-dark); text-decoration: none; }
.ns-header .ns-link:hover { text-decoration: underline; }
.ns-header .ns-actions { display: flex; align-items: center; gap: 10px; }
.ns-btn { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border: 1px solid transparent; border-radius: 6px; background: var(--rw-ocean-120); color: #fff; font: inherit; font-size: 13px; cursor: pointer; }
.ns-btn:hover { background: var(--rw-ocean-100); }
.ns-header .ns-export__btn { background: transparent; color: #fff; border-color: #fff; }
.ns-header .ns-export__btn:hover { background: var(--rw-ocean-120); }
.ns-header .ns-btn:focus-visible, .ns-header .ns-export__btn:focus-visible, .ns-header .ns-link:focus-visible { outline: 2px solid var(--rw-link-dark); outline-offset: 2px; }
@media print { .ns-header, .ns-strip { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }

/* Chart panel anatomy (NetSuite UI Toolkit chart specs): bold title, regular description directly beneath, then the plot. */
.ns-panel-title, .card h2 { margin: 0 0 2px; font-size: 14px; font-weight: 700; color: var(--ns-ink); }
.ns-panel-desc, .card .sub { margin: 0 0 10px; font-size: 12px; font-weight: 400; color: var(--ns-ink); }
/* Legend: small square swatches (also for line/area series), 11px label, bottom-centered by default. */
.ns-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; margin-top: 8px; font-size: 11px; color: var(--ns-ink); }
.ns-legend--top { margin: 0 0 8px; } .ns-legend--left, .ns-legend--right { flex-direction: column; justify-content: center; }
.ns-legend i { display: inline-block; width: 9px; height: 9px; margin-right: 6px; vertical-align: -1px; }

<body><main class="wrap"><header class="top"><h1>{{TITLE}}</h1><p>{{SCOPE}}</p><p>As of {{ASOF}}</p><p>{{CONCLUSION}}</p></header>
<div class="kpis">{{CARDS}}</div>{{SECTIONS}}{{COVERAGE}}{{SOURCES}}
<footer>Figures derive from the named source results and declared calculations. Missing, excluded and provisional evidence is identified above. No transactions executed.</footer>
</main><script>document.querySelectorAll('[data-sort]').forEach(b=>b.addEventListener('click',()=>{
 const tb=b.closest('table').tBodies[0],idx=Number(b.dataset.sort),dir=b.dataset.dir==='up'?-1:1;
 b.dataset.dir=dir===1?'up':'down';const rows=[...tb.rows];
 rows.sort((a,c)=>{const av=a.cells[idx]?.textContent||'',cv=c.cells[idx]?.textContent||'';
 const an=Number(av),cn=Number(cv);return dir*(av!==''&&cv!==''&&!Number.isNaN(an)&&!Number.isNaN(cn)?an-cn:av.localeCompare(cv));});
 rows.forEach(r=>tb.appendChild(r));}));
document.querySelectorAll('[data-project-picker]').forEach(s=>s.addEventListener('change',()=>{
 s.parentElement.querySelectorAll('[data-project]').forEach(p=>p.hidden=s.value!==''&&p.dataset.project!==s.value);}));
</script></body></html>
