<section id="expense-close-dashboard" aria-label="Expense Close Dashboard">
  <style>
    #expense-close-dashboard { --bg:#f5f7fb; --card:#fff; --ink:#182033; --muted:#667085; --line:#d9dfeb; --blue:#3157c8; --red:#b42318; --amber:#b54708; color:var(--ink); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    #expense-close-dashboard * { box-sizing:border-box; }
    #expense-close-dashboard .shell { overflow:hidden; border:1px solid var(--line); border-radius:16px; background:var(--bg); }
    #expense-close-dashboard header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 20px; border-bottom:1px solid var(--line); background:var(--card); }
    #expense-close-dashboard h1,#expense-close-dashboard h2,#expense-close-dashboard p { margin:0; }
    #expense-close-dashboard h1 { font-size:18px; } #expense-close-dashboard h2 { font-size:14px; }
    #expense-close-dashboard .muted { color:var(--muted); font-size:13px; }
    #expense-close-dashboard main { padding:20px; }
    #expense-close-dashboard .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    #expense-close-dashboard .stat,.list,.detail { border:1px solid var(--line); border-radius:12px; background:var(--card); }
    #expense-close-dashboard .stat { padding:14px; } #expense-close-dashboard .stat strong { display:block; margin-top:5px; font-size:21px; }
    #expense-close-dashboard .toolbar { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin:20px 0 10px; }
    #expense-close-dashboard .filters { display:flex; gap:8px; flex-wrap:wrap; }
    #expense-close-dashboard button { cursor:pointer; font:inherit; }
    #expense-close-dashboard .filter,.action { border-radius:8px; padding:8px 11px; font-size:13px; }
    #expense-close-dashboard .filter { border:1px solid var(--line); background:#fff; color:var(--ink); }
    #expense-close-dashboard .filter[aria-pressed="true"],#expense-close-dashboard .action { border:1px solid var(--blue); background:var(--blue); color:#fff; }
    #expense-close-dashboard .grid { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(260px,.75fr); gap:12px; }
    #expense-close-dashboard .list { overflow:hidden; }
    #expense-close-dashboard .list { --columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,.8fr) minmax(0,1.5fr); }
    #expense-close-dashboard .column-header { display:grid; grid-template-columns:var(--columns); gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--bg); color:var(--muted); font-size:12px; font-weight:650; }
    #expense-close-dashboard .cell-label { display:none; }
    #expense-close-dashboard .row > span { min-width:0; overflow-wrap:anywhere; }
    #expense-close-dashboard .row-wrap { position:relative; }
    #expense-close-dashboard .record-link { position:absolute; top:13px; left:14px; color:var(--blue); font-weight:650; text-decoration:underline; }
    #expense-close-dashboard .report-placeholder { visibility:hidden; }
    #expense-close-dashboard .row { width:100%; display:grid; grid-template-columns:var(--columns); gap:10px; align-items:center; padding:13px 14px; border:0; border-bottom:1px solid var(--line); background:transparent; color:var(--ink); text-align:left; }
    #expense-close-dashboard .row-wrap:last-child .row { border-bottom:0; } #expense-close-dashboard .row[aria-pressed="true"] { background:#eef3ff; }
    #expense-close-dashboard .report,.amount { font-weight:650; } #expense-close-dashboard .report { color:var(--blue); } #expense-close-dashboard .amount { font-variant-numeric:tabular-nums; }
    #expense-close-dashboard .row-select { grid-column:2 / -1; display:grid; grid-template-columns:1.2fr .8fr auto; align-items:center; gap:10px; min-width:0; padding:0; border:0; background:transparent; color:var(--ink); font:inherit; text-align:left; }
    #expense-close-dashboard .badge { border-radius:99px; padding:4px 8px; font-size:12px; background:#fffaeb; color:var(--amber); }
    #expense-close-dashboard .badge.high { background:#fef3f2; color:var(--red); }
    #expense-close-dashboard .detail { padding:16px; } #expense-close-dashboard dl { margin:16px 0; } #expense-close-dashboard dt { color:var(--muted); font-size:12px; } #expense-close-dashboard dd { margin:3px 0 10px; }
    #expense-close-dashboard .draft { margin-top:12px; padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); -webkit-text-fill-color:var(--ink); caret-color:var(--ink); color-scheme:light; white-space:pre-wrap; font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
    #expense-close-dashboard [hidden] { display:none!important; }
    @media (max-width:680px) { #expense-close-dashboard .column-header { display:none; } #expense-close-dashboard .record-link { top:35px; } #expense-close-dashboard .cell-label { display:block; color:var(--muted); font-size:12px; font-weight:400; margin-bottom:4px; } #expense-close-dashboard .summary,#expense-close-dashboard .grid { grid-template-columns:1fr; } #expense-close-dashboard .row { grid-template-columns:1fr 1fr; } #expense-close-dashboard .row-select { grid-column:2; grid-template-columns:1fr; } }
  </style>
  <div class="shell">
    <header><div><h1>Expense Close Dashboard</h1><p class="muted" id="context">Loading selected-period exceptions</p></div><span class="muted" id="basis"></span></header>
    <main>
      <section class="summary" aria-label="Exception summary"><div class="stat"><span class="muted">Needs attention</span><strong id="count">0</strong></div><div class="stat"><span class="muted">Exception report amount</span><strong id="total">—</strong></div><div class="stat"><span class="muted">Named approvers found</span><strong id="owners">0 of 0</strong></div></section>
      <div class="toolbar"><h2>Exceptions</h2><div class="filters"><button class="filter" type="button" aria-pressed="true" data-filter="all">All</button><button class="filter" type="button" aria-pressed="false" data-filter="high">High priority</button><button class="filter" type="button" aria-pressed="false" data-filter="ownerless">No named approver</button></div></div>
      <section class="grid"><div class="list" aria-label="Expense-report exceptions"><div class="column-header" aria-label="Exception column headers"><span>Report / date</span><span>Employee</span><span>Amount</span><span>Exception</span></div><div id="list"></div></div><aside class="detail" id="detail" aria-live="polite"></aside></section>
    </main>
  </div>
  <script>
    (() => {
      // DATA_START
      const dashboardData = { period: "No period loaded", scope: "All available", populationBasis: "Not returned", completeness: "unknown", retrievedAt: null, dataLoaded: false, reports: [] };
      // DATA_END
      const root=document.getElementById('expense-close-dashboard'), list=root.querySelector('#list'), detail=root.querySelector('#detail'), filters=[...root.querySelectorAll('.filter')]; let active='all', selected=0;
      const money=(n,c)=>{if(n==null||typeof n==='boolean'||String(n).trim()===''||!Number.isFinite(Number(n)))return 'Amount unavailable';if(!c)return `${Number(n).toLocaleString()} (currency unknown)`;try{return new Intl.NumberFormat(undefined,{style:'currency',currency:c}).format(Number(n));}catch{return `${Number(n).toLocaleString()} (${c})`;}};
      const known=r=>r.actionOwner&&r.actionOwner.name&&!['no named owner returned','no approver','accounting department'].includes(r.actionOwner.name.trim().toLowerCase());
      const fallbackOwner=r=>r.status==='Pending Accounting Approval'?'Accounting department':'No approver';
      const draftRecipient=r=>known(r)?r.actionOwner.name:r.status==='Pending Accounting Approval'?'Accounting department [specific contact/channel unresolved]':'[recipient unresolved — identify an approver]';
      const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const recordUrl=(report)=>{if(!report.recordUrl||report.recordUrlVerified!==true)return null;try{const url=new URL(report.recordUrl);return url.protocol==='https:'&&!url.username&&!url.password&&!url.pathname.startsWith('/services/rest/')&&!/^(t|true|1)$/i.test(url.searchParams.get('e')||'')&&url.searchParams.get('mode')!=='edit'?url.href:null;}catch{return null;}};
      const filtered=()=>dashboardData.reports.filter(r=>active==='all'||active==='high'&&r.priority==='high'||active==='ownerless'&&!known(r));
      function showDetail(r) {
        if(!r) { detail.innerHTML='<h2>No exception selected</h2><p class="muted">No report matches the active filter.</p>'; return; }
        const owner=known(r)?`${r.actionOwner.name} (${r.actionOwner.source||'source not returned'})`:fallbackOwner(r);
        const url=recordUrl(r);
        detail.innerHTML=`<h2>${esc(r.reportNumber)}</h2>${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open report in NetSuite</a>`:''}<dl><dt>Employee</dt><dd>${esc(r.employee||'Not returned')}</dd><dt>Exception</dt><dd>${esc(r.reason||'Not returned')}</dd><dt>Status</dt><dd>${esc(r.status||'Not returned')}</dd><dt>Approver</dt><dd>${esc(owner)}</dd></dl><button class="action" type="button" id="draft-button">Prepare follow-up draft</button><textarea class="draft" id="draft" aria-label="Editable follow-up draft" style="width:100%;min-height:180px" hidden></textarea>`;
        detail.querySelector('#draft-button').onclick=()=>{ const d=detail.querySelector('#draft'), url=recordUrl(r), recordReference=url?`\n\nExpense report record: ${url}`:''; d.textContent=`To: ${draftRecipient(r)}\n\nExpense report ${r.reportNumber} for ${r.employee||'the employee'} (${money(r.amount,r.currency)}) requires attention: ${r.reason||'exception not returned'}. Please review the next action for the ${dashboardData.period} close.${recordReference}`; d.hidden=false; };
      }
      function render() {
        const rows=filtered();
        if(selected>=rows.length)selected=0;
        list.innerHTML='';
        if(!rows.length)list.textContent='No exceptions match this filter.';
        rows.forEach((r,i)=>{
          const rowWrap=document.createElement('div');
          rowWrap.className='row-wrap';
          const url=recordUrl(r);
          const row=document.createElement('button');
          row.type='button';
          row.className='row';
          row.setAttribute('aria-pressed',String(i===selected));
          row.setAttribute('aria-controls','detail');
          row.setAttribute('aria-label',`Show details and follow-up for ${r.reportNumber}`);
          row.innerHTML=`<span><span class="cell-label">Report / date</span><span class="report ${url?'report-placeholder':''}">${esc(r.reportNumber)}</span><br><span class="muted">${esc(r.transactionDate||r.postingPeriod||'Date not returned')}</span></span><span><span class="cell-label">Employee</span>${esc(r.employee||'Employee not returned')}</span><span class="amount"><span class="cell-label">Amount</span>${esc(money(r.amount,r.currency))}</span><span><span class="cell-label">Exception</span><span class="badge ${r.priority==='high'?'high':''}">${esc(r.reason||'Review needed')}</span></span>`;
          row.onclick=()=>{
            selected=i;
            list.querySelectorAll('.row').forEach((item,index)=>item.setAttribute('aria-pressed',String(index===i)));
            showDetail(r);
          };
          rowWrap.appendChild(row);
          if(url) {
            const link=document.createElement('a');
            link.className='record-link';
            link.href=url;
            link.target='_blank';
            link.rel='noopener noreferrer';
            link.textContent=r.reportNumber;
            link.setAttribute('aria-label',`View ${r.reportNumber} in NetSuite (opens in a new tab)`);
            rowWrap.appendChild(link);
          }
          list.appendChild(rowWrap);
        });
        showDetail(rows[selected]);
      }
      const currencies=[...new Set(dashboardData.reports.map(r=>r.currency))];
      const amountsKnown=dashboardData.reports.every(r=>r.amount!=null&&typeof r.amount!=='boolean'&&String(r.amount).trim()!==''&&Number.isFinite(Number(r.amount)));
      root.querySelector('#context').textContent=`${dashboardData.period} · ${dashboardData.scope||'All available'} · Returned snapshot totals · Coverage: ${dashboardData.completeness||'unknown'} · Retrieved: ${dashboardData.retrievedAt||'unavailable'}`;
      root.querySelector('#basis').textContent=dashboardData.populationBasis||'Basis not returned';
      root.querySelector('#count').textContent=dashboardData.reports.length;
      root.querySelector('#total').textContent=!dashboardData.reports.length?(dashboardData.dataLoaded===true&&dashboardData.completeness==='complete'?'No exceptions in verified scope':'No verified population loaded'):!amountsKnown?'Amount unavailable':currencies.length===1&&currencies[0]?money(dashboardData.reports.reduce((s,r)=>s+Number(r.amount),0),currencies[0]):'Mixed or unknown currencies';
      root.querySelector('#owners').textContent=`${dashboardData.reports.filter(known).length} of ${dashboardData.reports.length}`;
      filters.forEach(f=>f.onclick=()=>{active=f.dataset.filter;selected=0;filters.forEach(x=>x.setAttribute('aria-pressed',String(x===f)));render();}); render();
    })();
  </script>
</section>
