<section id="benefits-portfolio-dashboard" class="bpm-dashboard" data-bpm-report="{{REPORT_TYPE}}" aria-label="Benefits portfolio">
  <svg class="bpm-atmosphere" viewBox="0 0 1600 2200" preserveAspectRatio="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bpm-glow-teal"><stop stop-color="#46c5cc" stop-opacity=".56"/><stop offset=".55" stop-color="#2b8a9c" stop-opacity=".23"/><stop offset="1" stop-color="#2b8a9c" stop-opacity="0"/></radialGradient>
      <radialGradient id="bpm-glow-coral"><stop stop-color="#f58f7c" stop-opacity=".55"/><stop offset=".58" stop-color="#bc6b83" stop-opacity=".2"/><stop offset="1" stop-color="#bc6b83" stop-opacity="0"/></radialGradient>
      <linearGradient id="bpm-ribbon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#70d8db" stop-opacity=".2"/><stop offset=".6" stop-color="#80a9c7" stop-opacity=".12"/><stop offset="1" stop-color="#f58f7c" stop-opacity=".2"/></linearGradient>
      <filter id="bpm-soften" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="48"/></filter>
    </defs>
    <ellipse cx="1310" cy="155" rx="510" ry="340" fill="url(#bpm-glow-coral)"/>
    <ellipse cx="280" cy="570" rx="560" ry="420" fill="url(#bpm-glow-teal)"/>
    <path d="M930 -100C1140 20 1300 20 1580 8L1680 335C1450 400 1260 520 1045 405C880 316 800 143 930-100Z" fill="url(#bpm-ribbon)" filter="url(#bpm-soften)"/>
    <path d="M-110 780C235 670 400 845 665 780C905 720 965 570 1220 615C1395 645 1515 765 1690 740L1685 950C1400 870 1270 960 1070 1015C790 1090 575 925 345 1020C115 1115 5 1090-110 1040Z" fill="url(#bpm-ribbon)" filter="url(#bpm-soften)"/>
    <ellipse cx="1430" cy="1360" rx="510" ry="400" fill="url(#bpm-glow-teal)"/>
    <ellipse cx="215" cy="1870" rx="505" ry="400" fill="url(#bpm-glow-coral)"/>
    <path d="M-100 1670C140 1510 410 1540 550 1690C725 1875 950 1815 1115 1700C1300 1570 1490 1600 1700 1705L1700 1965C1505 1845 1320 1880 1135 2015C905 2180 660 2080 510 1970C295 1810 155 1880-100 2030Z" fill="url(#bpm-ribbon)" filter="url(#bpm-soften)"/>
    <g fill="#f58f7c" opacity=".33"><ellipse cx="1220" cy="465" rx="13" ry="6" transform="rotate(24 1220 465)"/><ellipse cx="1265" cy="484" rx="9" ry="5" transform="rotate(24 1265 484)"/><ellipse cx="1315" cy="510" rx="15" ry="7" transform="rotate(24 1315 510)"/></g>
  </svg>
  <header class="bpm-header">

    {{SUMMARY}}
  </header>

</section>
<script>
(() => {
  'use strict';
  const root = document.getElementById('benefits-portfolio-dashboard');
  if (!root) return;
  const numericValue = (row) => {
    const value = row.getAttribute('data-bpm-sort-value');
    return value !== null && /^-?(?:0|[1-9]\d*)(?:\.\d+)?$/.test(value) && Number.isFinite(Number(value)) ? Number(value) : null;
  };
  root.querySelectorAll('[data-bpm-browse]').forEach((browse) => {
    const table = browse.querySelector('[data-bpm-table]');
    const container = browse.querySelector('[data-bpm-items]') || table?.tBodies[0];
    const controls = browse.querySelector('[data-bpm-controls]');
    if (!container || !controls) return;
    const rows = Array.from(container.children);
    if (!rows.length) return;
    const incomplete = browse.getAttribute('data-bpm-completeness') === 'partial';
    const expectedTotal = browse.getAttribute('data-bpm-expected-total');
    const search = controls.querySelector('[data-bpm-search]');
    const finding = controls.querySelector('[data-bpm-finding-filter]');
    const issue = controls.querySelector('[data-bpm-issue-filter]');
    const sort = controls.querySelector('[data-bpm-sort]');
    const reset = controls.querySelector('[data-bpm-reset]');
    const status = browse.querySelector('[data-bpm-row-status]');
    const empty = browse.querySelector('[data-bpm-filter-empty]');
    if (!search || !sort || !reset || !status || !empty) return;
    const pageSize = 25;
    let page = 0;
    const pagers = [];
    if (rows.length > pageSize) {
      const list = browse.querySelector('.bpm-table-scroll') || container;
      const makePager = (position) => {
        const nav = document.createElement('nav');
        nav.className = 'bpm-pager';
        nav.setAttribute('aria-label', position + ' record pagination');
        const count = document.createElement('p');
        count.className = 'bpm-pager-status';
        const actions = document.createElement('div');
        actions.className = 'bpm-pager-actions';
        const previous = document.createElement('button');
        previous.type = 'button';
        previous.textContent = 'Previous';
        previous.setAttribute('aria-label', 'Previous page of loaded records');
        const current = document.createElement('span');
        current.className = 'bpm-page-count';
        const next = document.createElement('button');
        next.type = 'button';
        next.textContent = 'Next';
        next.setAttribute('aria-label', 'Next page of loaded records');
        actions.append(previous, current, next);
        nav.append(count, actions);
        previous.addEventListener('click', () => { page -= 1; applyView(); });
        next.addEventListener('click', () => { page += 1; applyView(); });
        if (position === 'Before') list.before(nav); else list.after(nav);
        pagers.push({ count, current, previous, next });
      };
      makePager('Before');
      makePager('After');
    }
    const indexed = rows.map((row, index) => ({ row, index,
      label: row.getAttribute('data-bpm-sort-label') || row.cells?.[0]?.textContent || '',
      searchText: row.textContent.trim().toLocaleLowerCase(),
      findings: (row.getAttribute('data-bpm-findings') || '').split(/\s+/).filter(Boolean),
      issues: (row.getAttribute('data-bpm-issues') || '').split(/\s+/).filter(Boolean),
      numeric: numericValue(row) }));
    if (!indexed.some((item) => item.numeric !== null)) {
      sort.querySelectorAll('option[value="value-desc"], option[value="value-asc"]').forEach((option) => option.remove());
    }
    if (finding && !indexed.some((item) => item.findings.length)) {
      const label = finding.closest('label');
      if (label) label.hidden = true;
    }
    if (issue && !indexed.some((item) => item.issues.length)) {
      const label = issue.closest('label');
      if (label) label.hidden = true;
    }
    function applyView() {
      const query = search.value.trim().toLocaleLowerCase();
      const selectedFinding = finding ? finding.value : 'all';
      const selectedIssue = issue ? issue.value : 'all';
      const order = Array.from(indexed);
      if (sort.value === 'label-asc') {
        order.sort((a, b) => a.label.localeCompare(b.label) || a.index - b.index);
      } else if (sort.value === 'value-desc' || sort.value === 'value-asc') {
        const direction = sort.value === 'value-desc' ? -1 : 1;
        order.sort((a, b) => {
          if (a.numeric === null && b.numeric === null) return a.index - b.index;
          if (a.numeric === null) return 1;
          if (b.numeric === null) return -1;
          return direction * (a.numeric - b.numeric) || a.index - b.index;
        });
      }
      const matched = order.filter((item) => item.searchText.includes(query) &&
          (selectedFinding === 'all' || item.findings.includes(selectedFinding)) &&
          (selectedIssue === 'all' || item.issues.includes(selectedIssue)));
      const visible = matched.length;
      const pageCount = Math.max(1, Math.ceil(visible / pageSize));
      page = Math.min(Math.max(page, 0), pageCount - 1);
      const first = page * pageSize;
      const shown = new Set(matched.slice(first, first + pageSize));
      order.forEach((item) => {
        item.row.hidden = !shown.has(item);
        container.append(item.row);
      });
      pagers.forEach(({ count, current, previous, next }) => {
        count.textContent = visible ? 'Rows ' + (first + 1) + '–' + Math.min(first + pageSize, visible) + ' of ' + visible : 'No matching rows';
        current.textContent = 'Page ' + (page + 1) + ' of ' + pageCount;
        previous.disabled = page === 0;
        next.disabled = page >= pageCount - 1;
      });
      const filtered = query !== '' || selectedFinding !== 'all' || selectedIssue !== 'all';
      const sorted = sort.value !== 'original';
      const viewStatus = (filtered ? 'Filtered view' : sorted ? 'Sorted view' : 'Loaded view') + ': ' + visible + ' of ' + rows.length + ' loaded rows.';
      const completenessStatus = incomplete ? ' Partial work list: ' + rows.length +
        (expectedTotal ? ' of ' + expectedTotal + ' checked rows loaded.' : ' checked rows loaded; requested details remain incomplete.') : '';
      status.textContent = viewStatus + completenessStatus + (filtered ? ' Scope totals unchanged.' : '') +
        (pagers.length ? ' Page ' + (page + 1) + ' of ' + pageCount + '.' : '');
      status.setAttribute('data-bpm-idle', !filtered && !sorted && !incomplete ? 'true' : 'false');
      empty.hidden = visible !== 0;
      reset.disabled = !filtered && sort.value === 'original';
    }
    search.addEventListener('input', () => { page = 0; applyView(); });
    sort.addEventListener('change', () => { page = 0; applyView(); });
    if (finding) finding.addEventListener('change', () => { page = 0; applyView(); });
    if (issue) issue.addEventListener('change', () => { page = 0; applyView(); });
    reset.addEventListener('click', () => {
      search.value = '';
      sort.value = 'original';
      if (finding) finding.value = 'all';
      if (issue) issue.value = 'all';
      page = 0;
      applyView();
      search.focus();
    });
    controls.hidden = rows.length <= 12 && !browse.hasAttribute('data-bpm-controls-always');
    applyView();
  });
  let printOpenState = null;
  window.addEventListener('beforeprint', () => {
    if (printOpenState) return;
    printOpenState = Array.from(root.querySelectorAll('details')).map((details) => [details, details.open]);
    printOpenState.forEach(([details]) => { details.open = true; });
  });
  window.addEventListener('afterprint', () => {
    printOpenState?.forEach(([details, wasOpen]) => { details.open = wasOpen; });
    printOpenState = null;
  });
})();
</script>
