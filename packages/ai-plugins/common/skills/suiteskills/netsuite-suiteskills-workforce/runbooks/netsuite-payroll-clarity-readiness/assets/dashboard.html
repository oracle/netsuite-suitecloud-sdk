<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payroll Clarity &amp; Readiness</title><style>
body{margin:0;padding:16px;background:#f6f5f0;color-scheme:light}

#payroll-readiness{color-scheme:light;--pr-bg:#f6f5f0;--pr-panel:#ffffff;--pr-ink:#142b3b;--pr-muted:#576875;--pr-line:#e3e8e9;--pr-teal:#176e65;--pr-soft:#edf5f2;--pr-amber:#86560d;--pr-amber-bg:#fcf3df;--pr-red:#aa3d36;--pr-red-bg:#fbefec;background:var(--pr-bg);color:var(--pr-ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.5;border-radius:20px;overflow:hidden}
#payroll-readiness *{box-sizing:border-box}#payroll-readiness h1,#payroll-readiness h2,#payroll-readiness h3,#payroll-readiness p{margin:0}#payroll-readiness button,#payroll-readiness input,#payroll-readiness select{font:inherit}#payroll-readiness button{color:inherit}#payroll-readiness button:focus-visible,#payroll-readiness summary:focus-visible{outline:3px solid var(--pr-teal);outline-offset:3px}#payroll-readiness [hidden]{display:none!important}
#payroll-readiness .pr-top{padding:18px 28px;border-bottom:1px solid var(--pr-line);display:flex;gap:10px;align-items:center;padding-right:110px;background:var(--pr-panel)}#payroll-readiness .pr-mark{background:var(--pr-ink);color:var(--pr-panel);border-radius:9px;width:30px;height:30px;display:grid;place-items:center}#payroll-readiness .pr-brand{font-weight:600;letter-spacing:-.3px}#payroll-readiness .pr-top small{color:var(--pr-muted)}
#payroll-readiness .pr-main{padding:28px}#payroll-readiness .pr-eyebrow{text-transform:uppercase;letter-spacing:1.6px;font-size:11px;font-weight:600;color:var(--pr-teal);margin-bottom:8px}#payroll-readiness h1{font-size:30px;line-height:1.15;letter-spacing:-1px;font-weight:600}#payroll-readiness .pr-sub{color:var(--pr-muted);margin-top:10px}#payroll-readiness .pr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}#payroll-readiness .pr-head-right{text-align:right;white-space:nowrap}#payroll-readiness .pr-badge{display:inline-flex;gap:6px;align-items:center;border-radius:6px;padding:4px 8px;font-size:11px;font-weight:600;background:var(--pr-soft);color:var(--pr-teal)}#payroll-readiness .pr-badge.attention{color:var(--pr-amber);background:var(--pr-amber-bg)}#payroll-readiness .pr-badge.blocker{color:var(--pr-red);background:var(--pr-red-bg)}#payroll-readiness .pr-date{font-size:12px;color:var(--pr-muted);margin-top:8px}
#payroll-readiness .pr-scope{display:flex;gap:26px;margin:24px 0 20px;padding-top:16px;border-top:1px solid var(--pr-line);flex-wrap:wrap}#payroll-readiness .pr-scope span{display:block;color:var(--pr-muted);font-size:11px;margin-bottom:3px}#payroll-readiness .pr-scope strong{font-weight:500;font-size:13px}
#payroll-readiness .pr-tabs{display:flex;border-bottom:1px solid var(--pr-line);gap:24px;margin-bottom:24px;flex-wrap:wrap}#payroll-readiness .pr-tab{background:none;border:0;border-bottom:2px solid transparent;padding:12px 0;color:var(--pr-muted);font-weight:500}#payroll-readiness .pr-tab[aria-selected=true]{color:var(--pr-teal);border-color:var(--pr-teal)}#payroll-readiness .pr-tab span{margin-left:6px;font-size:11px;background:var(--pr-panel);padding:1px 6px;border-radius:4px}
#payroll-readiness .pr-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}#payroll-readiness .pr-stat{text-align:left;border:1px solid var(--pr-line);border-radius:12px;background:var(--pr-panel);padding:16px;display:block;width:100%}#payroll-readiness .pr-stat-label{font-size:12px;color:var(--pr-muted)}#payroll-readiness .pr-stat-value{font-size:30px;letter-spacing:-1px;font-weight:500;margin:4px 0;font-variant-numeric:tabular-nums}#payroll-readiness .pr-stat-note{font-size:11px;color:var(--pr-muted)}#payroll-readiness .pr-stat:hover{border-color:var(--pr-teal)}
#payroll-readiness .pr-grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(220px,1fr);gap:20px}#payroll-readiness .pr-panel{border:1px solid var(--pr-line);border-radius:14px;background:var(--pr-panel);overflow:hidden}#payroll-readiness .pr-panel-head{padding:18px 20px;border-bottom:1px solid var(--pr-line);display:flex;align-items:center;justify-content:space-between;gap:12px}#payroll-readiness h2{font-size:16px;font-weight:600;letter-spacing:-.3px}#payroll-readiness h3{font-size:14px;font-weight:600}#payroll-readiness .pr-caption{font-size:12px;color:var(--pr-muted)}#payroll-readiness .pr-assessment{padding:18px 20px;background:var(--pr-amber-bg);margin-bottom:18px;border-radius:12px;display:flex;gap:12px}#payroll-readiness .pr-assessment i{color:var(--pr-amber);flex-shrink:0}#payroll-readiness .pr-assessment p{font-size:13px;margin-top:3px;color:var(--pr-muted)}
#payroll-readiness .pr-action{border:0;border-bottom:1px solid var(--pr-line);padding:17px 20px;width:100%;text-align:left;background:var(--pr-panel);display:flex;gap:12px;align-items:flex-start}#payroll-readiness .pr-action:last-child{border-bottom:0}#payroll-readiness .pr-action:hover{background:var(--pr-soft)}#payroll-readiness .pr-avatar{width:32px;height:32px;flex-shrink:0;border-radius:9px;background:var(--pr-bg);display:grid;place-items:center;font-size:11px;font-weight:600}#payroll-readiness .pr-action-copy{flex:1;min-width:0}#payroll-readiness .pr-action-title{font-weight:500;font-size:13px;margin-bottom:3px}#payroll-readiness .pr-action .pr-badge{margin-top:6px}#payroll-readiness .pr-arrow{color:var(--pr-muted);padding-top:5px}#payroll-readiness .pr-side-content{padding:18px 20px}#payroll-readiness .pr-check{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--pr-line);font-size:12px}#payroll-readiness .pr-check:last-child{border:0}#payroll-readiness .pr-check i{color:var(--pr-teal);flex-shrink:0;margin-top:2px}#payroll-readiness .pr-check.gap i{color:var(--pr-amber)}#payroll-readiness .pr-link-btn{border:0;background:none;padding:0;text-align:left;color:var(--pr-teal);font-size:12px;font-weight:500}#payroll-readiness .pr-footnote{margin-top:18px;padding-top:16px;border-top:1px solid var(--pr-line);color:var(--pr-muted);font-size:11px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
#payroll-readiness .pr-toolbar{display:flex;justify-content:space-between;gap:12px;align-items:end;margin:18px 0;flex-wrap:wrap}#payroll-readiness label{font-size:12px;color:var(--pr-muted);display:block}#payroll-readiness input,#payroll-readiness select{padding:10px 12px;border:1px solid var(--pr-line);border-radius:8px;background:var(--pr-panel);color:var(--pr-ink);display:block;margin-top:5px;max-width:100%;width:100%}#payroll-readiness .pr-search{flex:1;min-width:180px}#payroll-readiness .pr-filter{min-width:170px}#payroll-readiness .pr-employee{border-bottom:1px solid var(--pr-line)}#payroll-readiness .pr-employee:last-child{border:0}#payroll-readiness .pr-employee summary{padding:18px 20px;list-style:none;display:flex;gap:12px;align-items:center}#payroll-readiness .pr-employee summary::-webkit-details-marker{display:none}#payroll-readiness .pr-employee summary>div:nth-child(2){flex:1;min-width:0}#payroll-readiness .pr-detail{padding:0 20px 20px 64px;display:grid;grid-template-columns:1fr 1fr;gap:14px}#payroll-readiness .pr-detail-label{font-size:11px;color:var(--pr-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}#payroll-readiness .pr-detail p{font-size:13px}#payroll-readiness .pr-detail .pr-reference{grid-column:1/-1;font-size:11px;color:var(--pr-muted);border-top:1px solid var(--pr-line);padding-top:12px}#payroll-readiness .pr-empty{padding:30px;text-align:center;color:var(--pr-muted)}
#payroll-readiness .pr-cycle{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}#payroll-readiness .pr-milestone{padding:18px;background:var(--pr-panel);border:1px solid var(--pr-line);border-radius:12px}#payroll-readiness .pr-milestone.current{border-color:var(--pr-teal);background:var(--pr-soft)}#payroll-readiness .pr-milestone span{font-size:11px;color:var(--pr-muted)}#payroll-readiness .pr-milestone h3{margin:5px 0}#payroll-readiness .pr-milestone p{font-size:12px;color:var(--pr-muted)}#payroll-readiness .pr-checkpoint{padding:18px 20px;display:flex;gap:16px;align-items:center;border-bottom:1px solid var(--pr-line)}#payroll-readiness .pr-checkpoint:last-child{border:0}#payroll-readiness .pr-checkpoint div{flex:1}#payroll-readiness .pr-checkpoint p{font-size:12px;color:var(--pr-muted);margin-top:3px}#payroll-readiness .pr-secondary{background:var(--pr-bg);border:1px solid var(--pr-line);padding:8px 12px;border-radius:8px;font-size:12px;white-space:nowrap}#payroll-readiness .pr-coverage-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:20px}#payroll-readiness .pr-disclosure{margin-top:20px}#payroll-readiness .pr-disclosure>summary{padding:17px 20px;display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:500;list-style:none}#payroll-readiness .pr-coverage-grid h3{margin-bottom:8px}#payroll-readiness .pr-fyi{font-size:12px;padding:16px 20px;border-top:1px solid var(--pr-line);color:var(--pr-muted)}
@media(max-width:760px){#payroll-readiness .pr-main{padding:20px}#payroll-readiness .pr-grid{grid-template-columns:1fr}#payroll-readiness .pr-stats,#payroll-readiness .pr-cycle{grid-template-columns:repeat(2,1fr)}#payroll-readiness .pr-head{flex-direction:column}#payroll-readiness .pr-head-right{text-align:left}#payroll-readiness h1{font-size:26px}#payroll-readiness .pr-top{padding-left:20px}#payroll-readiness .pr-tabs{gap:16px}}
@media(max-width:440px){#payroll-readiness .pr-main{padding:16px}#payroll-readiness .pr-tabs{gap:10px}#payroll-readiness .pr-tab{font-size:12px}#payroll-readiness .pr-detail{grid-template-columns:1fr;padding-left:20px}#payroll-readiness .pr-employee summary{flex-wrap:wrap}#payroll-readiness .pr-employee summary>.pr-badge{margin-left:44px}#payroll-readiness .pr-checkpoint{align-items:flex-start;flex-direction:column}#payroll-readiness .pr-coverage-grid{grid-template-columns:1fr}#payroll-readiness .pr-stat{padding:12px}#payroll-readiness .pr-stat-value{font-size:26px}#payroll-readiness .pr-top small{display:none}}
@media(pointer:coarse){#payroll-readiness button,#payroll-readiness summary{min-height:44px}#payroll-readiness input,#payroll-readiness select{font-size:16px}}


#payroll-readiness,#pc-demo{border-radius:0;font-family:system-ui,sans-serif} #payroll-readiness .pr-top,#pc-demo .chrome{background:#084c61;color:#fff} #payroll-readiness .pr-top small{color:#fff} #payroll-readiness :is(.pr-panel,.pr-stat,.pr-assessment,.pr-milestone),#pc-demo :is(.panel,.stat,details){border-radius:0;box-shadow:none}
</style></head>
<body><div id="payroll-readiness" aria-label="Payroll readiness dashboard"></div>
<script>
// Populate this object with verified evidence for the current assessment.
const assessment = {scope:{subsidiary:'',frequency:'',runType:'',period:'',payDate:'',status:'',reviewedAt:'',assessment:'',payrollFeature:'unknown',payrollFeatureSource:'',auditMode:'inventory'},population:{reviewed:null,active:null,inclusionExceptions:null},employees:[],otherFindings:[],checks:[],milestones:[],checkpoints:[],fyi:[]};
(()=>{
const root=document.getElementById('payroll-readiness');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const value=x=>x===null||x===undefined||x===''?'Not verified':esc(x);
const safeUrl=x=>{try{const u=new URL(x);const host=assessment.scope.accountHost;return typeof host==='string'&&u.protocol==='https:'&&u.hostname===host&&!u.username&&!u.password&&(!u.port||u.port==='443')&&u.pathname.startsWith('/app/')&&!/[\\\s]/.test(String(x))?u.href:null;}catch{return null;}};
const link=(url,label)=>{const u=safeUrl(url);return u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" style="color:var(--pr-teal)">${esc(label)}</a>`:esc(label);};
const employees=assessment.employees??[],other=assessment.otherFindings??[],checks=assessment.checks??[];
const blockers=employees.reduce((n,e)=>n+e.issues.filter(i=>i.severity==='blocker').length,0)+other.filter(i=>i.severity==='blocker').length;
const partial=!checks.length||checks.some(c=>['partial','unverified'].includes(c.reviewed));
const scope=assessment.scope,pop=assessment.population;
const inventory=scope.auditMode==='inventory'||(scope.auditMode!=='retrospective'&&scope.payrollFeature!=='enabled');
const coverage=inventory?'Payroll readiness not assessed':partial?'Partial':'Completed';
const featureLabel=({enabled:'Enabled',disabled:'Disabled',unknown:'Unknown'})[scope.payrollFeature]??'Unknown';
const modeLabel=inventory?'Employee inventory only':scope.auditMode==='retrospective'?'Retrospective review':'Native payroll audit';
const badge=i=>`<span class="pr-badge ${i.severity==='blocker'?'blocker':'attention'}">${i.severity==='blocker'?'Blocker':'Needs attention'}</span>`;
const initial=e=>esc(e.name.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join(''));
let tab='overview',filter='all',query='',selected=null;
root.innerHTML=`<header class="pr-top"><div class="pr-mark" aria-hidden="true">✓</div><span class="pr-brand">Payroll Clarity</span><small>Readiness workspace</small></header><main class="pr-main"><div class="pr-head"><div><div class="pr-eyebrow">${esc(modeLabel)}</div><h1>${inventory?'Review available employee records.':scope.auditMode==='retrospective'?'Review historical payroll evidence.':'Catch issues before pay day.'}</h1><p class="pr-sub">${value(scope.subsidiary)} · ${value(scope.runType)} · ${value(scope.frequency)}</p></div><div class="pr-head-right"><span class="pr-badge ${partial||inventory?'attention':''}">Coverage: ${coverage}</span><div class="pr-date">Snapshot · ${value(scope.reviewedAt)}</div></div></div><div class="pr-scope"><div><span>Payroll availability</span><strong>${esc(featureLabel)}</strong><span>${value(scope.payrollFeatureSource)}</span></div><div><span>Pay period</span><strong>${value(scope.period)}</strong></div><div><span>Pay date</span><strong>${value(scope.payDate)}</strong></div><div><span>Run status</span><strong>${value(scope.status)}</strong></div><div><span>Access</span><strong>Read-only assessment</strong></div></div><nav class="pr-tabs" role="tablist" aria-label="Assessment views">${[['overview','Overview'],['employees','Employee worklist'],['cycle','Pay-cycle checkpoints']].map(([id,label])=>`<button type="button" class="pr-tab" id="tab-${id}" data-tab="${id}" role="tab" aria-selected="${id==='overview'}" aria-controls="panel-${id}">${label}</button>`).join('')}</nav>
<section id="panel-overview" role="tabpanel" aria-labelledby="tab-overview"><div class="pr-stats"><div class="pr-stat"><div class="pr-stat-label">Employees reviewed</div><div class="pr-stat-value">${value(pop.reviewed)}</div><div class="pr-stat-note">${value(pop.active)} active · ${value(pop.inclusionExceptions)} inclusion exceptions</div></div><button type="button" class="pr-stat" data-filter="blocker"><div class="pr-stat-label">Verified blockers</div><div class="pr-stat-value">${blockers}</div><div class="pr-stat-note">View supporting evidence →</div></button><button type="button" class="pr-stat" data-filter="all"><div class="pr-stat-label">Employees needing action</div><div class="pr-stat-value">${employees.length}</div><div class="pr-stat-note">Counted once per employee →</div></button><button type="button" class="pr-stat" data-coverage><div class="pr-stat-label">Check coverage</div><div class="pr-stat-value" style="font-size:24px">${coverage}</div><div class="pr-stat-note">Inspect checks and limitations ↓</div></button></div><div class="pr-assessment"><div><h3>${value(scope.assessment)}</h3><p>${partial?'Applicable checks remain partially reviewed or unverified.':'No unverified applicable checks are recorded in this assessment.'}</p></div></div><div class="pr-grid"><section class="pr-panel"><div class="pr-panel-head"><div><h2>Your next actions</h2><div class="pr-caption">Verified blockers first, then attention items</div></div><button type="button" class="pr-link-btn" data-filter="all">View worklist →</button></div><div id="actions"></div></section><aside class="pr-panel"><div class="pr-panel-head"><h2>Checks at a glance</h2></div><div class="pr-side-content">${checks.slice(0,5).map(c=>`<div class="pr-check ${['partial','unverified'].includes(c.reviewed)?'gap':''}"><span aria-hidden="true">${c.reviewed==='complete'?'✓':c.reviewed==='not-applicable'?'—':'○'}</span><div>${esc(c.label)}<div class="pr-caption">${esc(c.outcome)}</div></div></div>`).join('')||'<p class="pr-caption">No checks populated.</p>'}<button type="button" class="pr-link-btn" data-coverage style="margin-top:16px">Inspect all checks ↓</button></div></aside></div><details id="coverage" class="pr-panel pr-disclosure"><summary>Checks and evidence <span class="pr-caption">Completion is separate from outcome</span></summary><div class="pr-side-content">${checks.map(c=>`<div class="pr-check"><span>${c.reviewed==='complete'?'✓':c.reviewed==='not-applicable'?'—':'○'}</span><div><h3>${esc(c.label)}</h3><div class="pr-caption">${esc(c.reviewed)} · ${esc(c.outcome)}</div><p>${esc(c.evidence)}</p></div></div>`).join('')||'<p>No check evidence populated.</p>'}</div><div class="pr-fyi">Completed review does not mean a passing result. Partial setup checks do not guarantee successful payroll processing.</div></details></section>
<section id="panel-employees" role="tabpanel" aria-labelledby="tab-employees" hidden><h2>Employee worklist</h2><p class="pr-caption">Inspect evidence and next actions. Expanding an item does not resolve it.</p><div class="pr-toolbar"><label class="pr-search">Find an employee<input id="search" type="search" placeholder="Search name, ID or issue"></label><label class="pr-filter">Show<select id="filter"><option value="all">All action items</option><option value="blocker">Verified blockers</option><option value="setup">Location &amp; workplace</option><option value="inclusion">Payroll inclusion</option><option value="time">Time inputs</option><option value="other">Other findings</option></select></label></div><p id="count" class="pr-caption" aria-live="polite" style="margin-bottom:10px"></p><div id="worklist" class="pr-panel"></div></section>
<section id="panel-cycle" role="tabpanel" aria-labelledby="tab-cycle" hidden><h2>Prepare for the next step</h2><p class="pr-caption">Confirmed dates and verified cutoffs only. Dates do not establish processing completion.</p><div class="pr-cycle">${(assessment.milestones??[]).map(m=>`<div class="pr-milestone ${m.current?'current':''}"><span>${esc(m.date)}</span><h3>${esc(m.title)}</h3><p>${esc(m.note)}</p></div>`).join('')||'<p class="pr-caption">No confirmed milestones populated.</p>'}</div><div class="pr-panel">${(assessment.checkpoints??[]).map(c=>`<div class="pr-checkpoint"><div><h3>${esc(c.title)}</h3><p>${esc(c.note)}</p></div><span class="pr-badge attention">${esc(c.outcome)}</span><button type="button" class="pr-secondary" ${c.filter==='coverage'?'data-coverage':`data-filter="${esc(c.filter)}"`}>Inspect evidence →</button></div>`).join('')||'<div class="pr-side-content pr-caption">No checkpoints populated.</div>'}</div></section><div id="other-findings"></div>${(assessment.fyi??[]).map(t=>`<div class="pr-fyi">${esc(t)}</div>`).join('')}<footer class="pr-footnote"><span>Read-only account assessment · No records changed</span><span>New checks require another connector run</span></footer></main>`;
function show(t){tab=t;root.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));['overview','employees','cycle'].forEach(x=>root.querySelector('#panel-'+x).hidden=x!==tab);}
const matches=i=>filter==='all'||(filter==='blocker'?i.severity==='blocker':i.category===filter);
const ordered=[...employees].sort((a,b)=>Number(b.issues.some(i=>i.severity==='blocker'))-Number(a.issues.some(i=>i.severity==='blocker')));
root.querySelector('#actions').innerHTML=ordered.flatMap(e=>[...e.issues].sort((a,b)=>Number(b.severity==='blocker')-Number(a.severity==='blocker')).map(i=>`<button type="button" class="pr-action" data-employee="${esc(e.id)}"><span class="pr-avatar">${initial(e)}</span><span class="pr-action-copy"><div class="pr-action-title">${esc(i.title)}</div><div class="pr-caption">${esc(e.name)}</div>${badge(i)}</span><span class="pr-arrow" aria-hidden="true">↗</span></button>`)).join('')||'<div class="pr-side-content">No employee action findings in the completed checks.</div>';
function issueDetail(i){return `<div class="pr-detail"><div><div class="pr-detail-label">Supporting evidence</div><h3>${esc(i.title)}</h3><p>${esc(i.evidence)}</p></div><div><div class="pr-detail-label">Next action</div><p>${esc(i.action)}</p>${safeUrl(i.recordUrl)?link(i.recordUrl,'Open affected record'):''}</div></div>`;}
function render(){const q=query.toLowerCase();const rows=ordered.filter(e=>e.issues.some(matches)&&`${e.name} ${e.id} ${e.issues.map(i=>i.title+' '+i.evidence).join(' ')}`.toLowerCase().includes(q));root.querySelector('#count').textContent=`${rows.length} of ${employees.length} employees needing action`;
root.querySelector('#worklist').innerHTML=rows.map(e=>{const issues=e.issues.filter(matches),urgent=issues.find(i=>i.severity==='blocker')??issues[0];return `<details class="pr-employee" ${String(e.id)===selected?'open':''}><summary><span class="pr-avatar">${initial(e)}</span><div><h3>${esc(e.name)}</h3><div class="pr-caption">${issues.length} ${issues.length===1?'finding':'findings'} · Employee ID ${esc(e.id)}</div></div>${badge(urgent)}<span aria-hidden="true">⌄</span></summary>${issues.map(issueDetail).join('')}<div class="pr-fyi">${safeUrl(e.recordUrl)?link(e.recordUrl,'Open employee in NetSuite'):'Record link unavailable'} · Employee ID ${esc(e.id)}</div></details>`;}).join('')||'<div class="pr-empty">No employee action items match this view.</div>';
const visibleOther=other.filter(matches);root.querySelector('#other-findings').innerHTML=visibleOther.length?`<details class="pr-panel pr-disclosure"><summary>Other record findings · ${visibleOther.length}</summary>${visibleOther.map(i=>`<div class="pr-side-content"><h3>${esc(i.recordName)}</h3>${badge(i)}</div>${issueDetail(i)}`).join('')}</details>`:'';}
root.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));
root.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;query='';selected=null;root.querySelector('#filter').value=filter;root.querySelector('#search').value='';render();show('employees');}));
root.querySelectorAll('[data-employee]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.employee;filter='all';query='';root.querySelector('#filter').value=filter;root.querySelector('#search').value='';render();show('employees');}));
root.querySelectorAll('[data-coverage]').forEach(b=>b.addEventListener('click',()=>{show('overview');const d=root.querySelector('#coverage');d.open=true;d.scrollIntoView({block:'start'});}));
root.querySelector('#search').addEventListener('input',e=>{query=e.target.value;render();});root.querySelector('#filter').addEventListener('change',e=>{filter=e.target.value;selected=null;render();});
root.querySelector('[role=tablist]').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const tabs=[...root.querySelectorAll('[data-tab]')],index=tabs.indexOf(document.activeElement);if(index<0)return;e.preventDefault();const n=e.key==='Home'?0:e.key==='End'?tabs.length-1:(index+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;show(tabs[n].dataset.tab);tabs[n].focus();});
render();
})();
</script>
</body></html>
